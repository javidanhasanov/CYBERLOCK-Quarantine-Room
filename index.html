<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBERLOCK: Quarantine Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#0067c0;--accent-dark:#005a9e;--accent-light:#e5f0fb;
  --win-bg:#f3f3f3;--win-surface:#fff;--win-border:#e5e5e5;
  --text:#1a1a1a;--text-2:#5c5c5c;--text-3:#6b6b6b;
  --danger:#c42b1c;--danger-light:#fdecea;--success:#0f7b3f;--success-light:#e6f4ec;
  --warn:#b26b00;--warn-light:#fff4e0;--radius:8px;
  --font:'Segoe UI','Segoe UI Web (West European)',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif;
}
html,body{height:100%}
body{font-family:var(--font);overflow:hidden;background:#050a14;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.38);background-clip:content-box}

/* BOOT */
#boot-screen{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#0d1b33 0%,#050a14 70%);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
#boot-screen.fade{opacity:0;pointer-events:none}
.boot-inner{width:360px;text-align:center}
.boot-logo{width:78px;height:78px;margin:0 auto 26px;color:#4da3ff;filter:drop-shadow(0 0 26px rgba(77,163,255,.55));animation:bootPulse 2.2s ease-in-out infinite}
.boot-logo svg{width:100%;height:100%}
@keyframes bootPulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
.boot-title{font-size:26px;font-weight:600;letter-spacing:.34em;color:#eaf3ff;margin-bottom:8px;padding-left:.34em}
.boot-sub{font-size:12px;color:#6f88a8;letter-spacing:.16em;text-transform:uppercase;margin-bottom:34px}
.boot-status{font-size:12.5px;color:#8fb2d6;min-height:18px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.boot-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
.boot-bar-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#2b7de0,#5ab0ff);transition:width .45s ease}

/* DESKTOP */
#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;background:radial-gradient(circle at 22% 26%,rgba(58,120,255,.42),transparent 52%),radial-gradient(circle at 78% 74%,rgba(150,72,255,.34),transparent 52%),radial-gradient(circle at 52% 50%,rgba(0,170,255,.18),transparent 62%),linear-gradient(140deg,#081124 0%,#101d38 45%,#0a1428 100%)}
#wallpaper::after{content:'Think before you click';position:absolute;right:26px;bottom:66px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.14);font-weight:500;pointer-events:none}
#desktop-icons{position:absolute;top:16px;left:14px;display:flex;flex-direction:column;gap:4px;width:96px;z-index:10}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;border-radius:6px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.desktop-icon:hover{background:rgba(255,255,255,.13)}
.desktop-icon.selected{background:rgba(0,103,192,.32);border-color:rgba(77,163,255,.5)}
.desktop-icon .tile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.desktop-icon .tile svg{width:24px;height:24px}
.desktop-icon .label{font-size:11.5px;color:#fff;text-align:center;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.85);word-break:break-word}

/* LOCK WIDGET */
#lock-widget{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:84px;padding:14px 8px 16px;background:rgba(10,16,28,.58);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.14);border-radius:18px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 12px 40px rgba(0,0,0,.42)}
.lw-title{font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:600}
.lw-counter{font-size:17px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lw-counter span{font-size:11px;color:rgba(255,255,255,.45)}
.lw-best{font-size:10px;color:rgba(255,255,255,.5);font-weight:500}
.lw-locks{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.lw-lock{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.28);transition:all .45s cubic-bezier(.34,1.56,.64,1)}
.lw-lock svg{width:22px;height:22px}
.lw-lock.open{color:#4ade80;background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.4);box-shadow:0 0 18px rgba(74,222,128,.35);animation:lockPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes lockPop{0%{transform:scale(.7) rotate(-14deg)}60%{transform:scale(1.16) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.lw-progress{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.lw-progress-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .5s ease}

/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:5000;background:rgba(243,243,243,.84);-webkit-backdrop-filter:blur(34px) saturate(160%);backdrop-filter:blur(34px) saturate(160%);border-top:1px solid rgba(255,255,255,.55);display:flex;align-items:center;box-shadow:0 -2px 20px rgba(0,0,0,.18)}
#taskbar-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px}
.tb-btn{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;color:#1a1a1a;transition:background .12s;position:relative}
.tb-btn:hover{background:rgba(0,0,0,.07)}
.tb-btn:active{transform:scale(.93)}
.tb-btn.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:var(--accent)}
.tb-btn svg{width:21px;height:21px}
.tb-btn .tb-app-icon{width:21px;height:21px;display:grid;place-items:center}
.tb-btn .tb-app-icon svg{width:21px;height:21px}
#start-btn{width:42px;height:42px}
#start-btn:hover{background:rgba(0,0,0,.07)}
#start-btn svg{width:20px;height:20px}
#system-tray{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:6px;height:100%}
.tray-btn{height:32px;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 9px;color:#1a1a1a;transition:background .12s;font-size:12px;position:relative}
.tray-btn:hover{background:rgba(0,0,0,.07)}
.tray-btn svg{width:16px;height:16px}
.tray-btn.active{background:rgba(0,103,192,.12);color:var(--accent)}
#tray-clock{height:32px;border-radius:6px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 10px;font-size:11.5px;line-height:1.32;transition:background .12s;font-variant-numeric:tabular-nums;cursor:pointer}
#tray-clock:hover{background:rgba(0,0,0,.07)}
#tray-clock .t2{color:var(--text-2);font-size:10.5px}
#tray-timer{height:32px;border-radius:16px;display:flex;align-items:center;gap:6px;padding:0 12px;color:#1a1a1a;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600;transition:background .12s,color .25s;letter-spacing:.02em;border:1px solid transparent;cursor:pointer}
#tray-timer:hover{background:rgba(0,0,0,.07)}
#tray-timer svg{width:14px;height:14px}
#tray-timer.danger{color:var(--danger);animation:timerPulse 1s ease-in-out infinite;border-color:rgba(196,43,28,.3);background:rgba(196,43,28,.06)}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.55}}
#tray-hint{color:#b26b00}
#tray-hint:hover{background:rgba(178,107,0,.12)}
#tray-hint.disabled{color:var(--text-3);opacity:.55}
.bell-badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1;border:1.5px solid #f3f3f3}

/* START MENU */
#start-menu{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);width:492px;max-height:calc(100vh - 90px);z-index:6000;background:rgba(243,243,243,.93);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(0,0,0,.1);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.42);padding:22px 26px 16px;display:flex;flex-direction:column;animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
@keyframes startIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.sm-search{display:flex;align-items:center;gap:8px;height:34px;background:#fff;border:1px solid #dcdcdc;border-radius:17px;padding:0 13px;margin-bottom:16px;color:var(--text-3);font-size:12.5px;transition:border-color .12s}
.sm-search:focus-within{border-color:var(--accent)}
.sm-search svg{width:15px;height:15px;flex:none}
.sm-search input{flex:1;border:none;outline:none;background:transparent;font-size:12.5px;color:var(--text)}
.sm-section-label{font-size:11.5px;font-weight:600;color:var(--text-3);margin-bottom:8px;margin-top:6px}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:7px;transition:background .12s}
.sm-app:hover{background:rgba(0,0,0,.06)}
.sm-app .tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff}
.sm-app .tile svg{width:20px;height:20px}
.sm-app .label{font-size:11px;color:#2b2b2b;text-align:center;line-height:1.2}
.sm-recommended{display:flex;flex-direction:column;gap:1px;margin-bottom:14px;max-height:200px;overflow-y:auto}
.sm-rec-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;transition:background .1s;cursor:pointer;text-align:left;width:100%}
.sm-rec-item:hover{background:rgba(0,0,0,.06)}
.sm-rec-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.sm-rec-icon svg{width:16px;height:16px}
.sm-rec-name{font-size:12px;font-weight:500}
.sm-rec-sub{font-size:10.5px;color:var(--text-3)}
.sm-empty{font-size:11.5px;color:var(--text-3);padding:8px 4px}
.sm-footer{border-top:1px solid rgba(0,0,0,.09);padding-top:12px;display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.sm-user{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:500;color:#1a1a1a}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2b7de0,#7a4dff);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
.sm-power{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#3b3b3b;transition:background .12s}
.sm-power:hover{background:rgba(0,0,0,.07)}
.sm-power svg{width:17px;height:17px}

/* NOTIFICATION CENTER */
#notif-panel{position:fixed;right:8px;bottom:54px;z-index:6500;width:360px;max-height:480px;display:flex;flex-direction:column;background:rgba(243,243,243,.96);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(0,0,0,.1);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px;font-weight:600;flex:none}
.notif-head button{font-size:11px;color:var(--accent);font-weight:600;padding:4px 8px;border-radius:4px}
.notif-head button:hover{background:rgba(0,103,192,.1)}
.notif-list{flex:1;overflow-y:auto;padding:6px;min-height:80px}
.notif-empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:12px}
.notif-item{display:flex;gap:10px;padding:10px 12px;border-radius:7px;margin-bottom:3px;transition:background .1s;cursor:pointer}
.notif-item:hover{background:rgba(0,0,0,.04)}
.notif-item.unread{background:rgba(0,103,192,.06)}
.notif-icon{width:18px;height:18px;flex:none;margin-top:1px}
.notif-icon svg{width:18px;height:18px}
.notif-icon.ni-info{color:var(--accent)}
.notif-icon.ni-success{color:var(--success)}
.notif-icon.ni-error{color:var(--danger)}
.notif-icon.ni-warn{color:var(--warn)}
.notif-body{min-width:0;flex:1}
.notif-title{font-size:12px;font-weight:600;margin-bottom:2px;color:var(--text)}
.notif-msg{font-size:11.5px;color:var(--text-2);line-height:1.5;word-break:break-word}
.notif-time{font-size:10px;color:var(--text-3);margin-top:4px}

/* QUICK SETTINGS */
#quick-settings{position:fixed;right:8px;bottom:56px;z-index:6500;width:340px;background:rgba(243,243,243,.97);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(0,0,0,.1);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:16px;animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
.qs-head{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text)}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.qs-tile{display:flex;align-items:center;gap:9px;padding:10px;border-radius:8px;background:#e8e8e8;text-align:left;transition:background .12s,color .12s}
.qs-tile:hover{background:#ddd}
.qs-tile.active{background:var(--accent);color:#fff}
.qs-tile svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.qs-tile.active svg{color:#fff}
.qs-name{font-size:11.5px;font-weight:600;line-height:1.2}
.qs-status{font-size:10px;color:var(--text-3);margin-top:1px}
.qs-tile.active .qs-status{color:rgba(255,255,255,.8)}
.qs-slider-row{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:12px;color:var(--text-2)}
.qs-slider-row svg{width:16px;height:16px;flex:none;color:var(--text-2)}
.qs-slider{flex:1;accent-color:var(--accent);cursor:pointer;height:4px}
.qs-slider-val{font-size:11px;color:var(--text-3);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}

/* CALENDAR PANEL */
#calendar-panel{position:fixed;right:8px;bottom:56px;z-index:6500;width:320px;background:rgba(243,243,243,.97);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(0,0,0,.1);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:16px;animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
.cal-head{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.cal-head span:last-child{font-size:11px;color:var(--text-3);font-weight:400}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}
.cal-dow{color:var(--text-3);font-weight:600;padding:4px 0;font-size:10px}
.cal-day{padding:6px 0;border-radius:5px;transition:background .1s;cursor:pointer;color:var(--text-2)}
.cal-day:hover{background:rgba(0,0,0,.06)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day.other{color:#c4c4c4}
.cal-time{text-align:center;font-size:22px;font-weight:600;margin-bottom:14px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cal-date{text-align:center;font-size:12px;color:var(--text-3);margin-bottom:14px}

/* WINDOWS */
#windows-layer{position:absolute;inset:0;pointer-events:none}
.window{position:absolute;pointer-events:auto;background:var(--win-bg);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(0,0,0,.1);box-shadow:0 18px 60px rgba(0,0,0,.44),0 0 0 1px rgba(0,0,0,.04);animation:winIn .18s cubic-bezier(.2,.9,.3,1);min-width:400px;min-height:280px}
@keyframes winIn{from{opacity:0;transform:scale(.965) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.window.closing{animation:winOut .13s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.96)}}
.win-titlebar{height:40px;flex:none;display:flex;align-items:center;padding-left:14px;gap:10px;background:#f3f3f3;border-bottom:1px solid rgba(0,0,0,.05);cursor:default}
.win-titlebar .win-icon{width:17px;height:17px;display:grid;place-items:center;color:#3b3b3b;flex:none}
.win-titlebar .win-icon svg{width:17px;height:17px}
.win-title{font-size:12px;font-weight:600;color:#1a1a1a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.win-controls{display:flex;flex:none;align-self:stretch}
.win-btn{width:46px;display:grid;place-items:center;color:#1a1a1a;transition:background .1s;align-self:stretch}
.win-btn:hover{background:rgba(0,0,0,.065)}
.win-btn.close:hover{background:#c42b1c;color:#fff}
.win-body{flex:1;overflow:hidden;background:var(--win-surface);display:flex;flex-direction:column;min-height:0}

/* TOOLBAR */
.app-toolbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:#fbfbfb;border-bottom:1px solid #ebebeb}
.tool-btn{height:30px;padding:0 11px;border-radius:5px;font-size:12px;display:flex;align-items:center;gap:6px;color:#2b2b2b;transition:background .1s}
.tool-btn:hover{background:rgba(0,0,0,.06)}
.tool-btn svg{width:15px;height:15px}
.tool-btn.primary{background:var(--accent);color:#fff}
.tool-btn.primary:hover{background:var(--accent-dark)}
.tool-btn.danger{background:var(--danger);color:#fff}
.tool-btn.danger:hover{background:#a02015}
.tool-btn:disabled{opacity:.42;cursor:not-allowed}
.tool-sep{width:1px;height:20px;background:#e0e0e0;margin:0 3px}

/* MAIL */
.mail-layout{flex:1;display:flex;min-height:0}
.mail-list{width:300px;flex:none;border-right:1px solid #ebebeb;overflow-y:auto;background:#fff}
.mail-item{padding:11px 14px;border-bottom:1px solid #f2f2f2;cursor:pointer;transition:background .1s;position:relative}
.mail-item:hover{background:#f5f9ff}
.mail-item.selected{background:var(--accent-light)}
.mail-item.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.mail-item .mi-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.mail-item .mi-from{font-size:12.5px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item .mi-time{font-size:10.5px;color:var(--text-3);flex:none}
.mail-item .mi-subject{font-size:12px;color:#3b3b3b;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item .mi-preview{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-reader{flex:1;overflow-y:auto;padding:22px 26px;min-width:0}
.mail-reader h2{font-size:17px;font-weight:600;margin-bottom:12px;color:#1a1a1a;line-height:1.35}
.mail-meta{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid #ececec;margin-bottom:18px}
.mail-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;flex:none}
.mail-meta-txt{font-size:12px;line-height:1.5;min-width:0}
.mail-meta-txt .m-name{font-weight:600;color:#1a1a1a}
.mail-meta-txt .m-addr{color:var(--text-3);font-size:11.5px;word-break:break-all}
.mail-body{font-size:13px;line-height:1.72;color:#2b2b2b}
.mail-body p{margin-bottom:11px}
.mail-body a{color:var(--accent);text-decoration:underline;cursor:pointer}
.mail-empty{flex:1;display:grid;place-items:center;color:#b0b0b0;font-size:13px;text-align:center;padding:30px}
.mail-empty svg{width:52px;height:52px;margin:0 auto 12px;color:#d8d8d8}

/* CONTEXT MENU */

#escape-screen.timeup .esc-badge{background:radial-gradient(circle at 35% 30%,rgba(248,113,113,.3),rgba(248,113,113,.05));border-color:rgba(248,113,113,.5);color:#f87171;box-shadow:0 0 60px rgba(248,113,113,.35)}
.esc-badge svg{width:44px;height:44px}
@keyframes escPulse{0%,100%{box-shadow:0 0 50px rgba(74,222,128,.3)}50%{box-shadow:0 0 84px rgba(74,222,128,.55)}}
.esc-title{font-size:33px;font-weight:700;color:#fff;letter-spacing:.02em;margin-bottom:10px}
.esc-sub{font-size:13.5px;color:#7fa3cc;margin-bottom:32px;line-height:1.7}
.esc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:28px}
.esc-stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:16px 8px}
.esc-stat .es-val{font-size:23px;font-weight:700;color:#eaf3ff;margin-bottom:5px;font-variant-numeric:tabular-nums}
.esc-stat .es-lbl{font-size:10px;color:#6f88a8;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.esc-badges-title{font-size:10.5px;color:#6f88a8;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.esc-badges{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:34px}
.esc-badge-pill{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(77,163,255,.11);border:1px solid rgba(77,163,255,.3);font-size:12px;color:#a8d0ff;font-weight:500}
.esc-badge-pill svg{width:14px;height:14px;color:#4da3ff}
.esc-btn{height:44px;padding:0 34px;border-radius:22px;font-size:13.5px;font-weight:600;background:linear-gradient(135deg,#2b7de0,#5ab0ff);color:#fff;box-shadow:0 10px 30px rgba(43,125,224,.4);transition:transform .15s,box-shadow .15s;margin:0 6px}
.esc-btn:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(43,125,224,.55)}
.esc-btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#a8d0ff;box-shadow:none}
.esc-btn.ghost:hover{background:rgba(255,255,255,.08)}
.esc-note{font-size:11px;color:#4a6280;margin-top:20px;line-height:1.7}
.app-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--text-2)}
.app-done .ad-icon{width:62px;height:62px;border-radius:50%;background:var(--success-light);color:var(--success);display:grid;place-items:center;margin-bottom:16px}
.app-done .ad-icon svg{width:30px;height:30px}
.app-done h3{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:7px}
.app-done p{font-size:12.5px;line-height:1.65;max-width:340px;color:var(--text-3)}

@media (max-width:1100px){
  #lock-widget{transform:translateY(-50%) scale(.88);right:8px}
  .window{min-width:340px}
  #notif-panel,#quick-settings,#calendar-panel{width:320px}
}

      how:['File Explorer-da "Fayl uzantılarını göstər" seçimini aktiv saxla.','İkiqat uzantıya (".jpg.exe", ".pdf.exe") həmişə diqqət et.','Naməlum mənbədən gələn .exe, .msi, .bat, .scr fayllarını açma.','Faylı açmadan əvvəl antivirusla yoxla.']
    }
  }
};
const TASK_ORDER = ['mail','password','browser','settings','files'];

/* ============ STATE ============ */
const SAVE_KEY = 'cyberlock_save_v2';
const DEFAULT_DURATION = 10 * 60 * 1000;
const SPEEDRUN_DURATION = 4 * 60 * 1000;

const state = {
  score: 0, bestScore: 0,
  solved: {}, hintsUsed: {}, wrong: {}, firstTry: {},
  consecutive: 0, totalWrong: 0, activeTask: null,
  taskStart: {},
  mode: 'normal',
  timerDuration: DEFAULT_DURATION,
  timerEnd: null, timerRemaining: DEFAULT_DURATION,
  timerStarted: false, timerInterval: null,
  escaped: false, recentApps: [], lang: 'az',
  currentSettingsPanel: 'accounts',
  settingsToggles: { wifi: true, bluetooth: false, plane: false, night: false },
  volume: 65, brightness: 80
};

const SOLVED_COUNT = () => Object.keys(state.solved).length;
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
const pad2 = n => n < 10 ? '0' + n : '' + n;
const fmtTime = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60); };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ============ EVENT BUS ============ */
const events = {
  _l: {},
  on(name, fn){ (this._l[name] = this._l[name] || []).push(fn); return fn; },
  off(name, fn){ const arr = this._l[name]; if (arr) this._l[name] = arr.filter(f => f !== fn); },
  emit(name, data){ (this._l[name] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); }
};

/* ============ PERSISTENCE ============ */
function saveState(){
  try {
    const payload = {
      score: state.score, bestScore: state.bestScore,
      solved: state.solved, hintsUsed: state.hintsUsed, wrong: state.wrong,
      firstTry: state.firstTry, consecutive: state.consecutive, totalWrong: state.totalWrong,
      mode: state.mode, timerDuration: state.timerDuration, timerEnd: state.timerEnd,
      timerStarted: state.timerStarted, escaped: state.escaped,
      recentApps: state.recentApps, lang: state.lang,
      settingsToggles: state.settingsToggles, volume: state.volume, brightness: state.brightness
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
  } catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.score !== undefined) state.score = d.score;
    if (d.bestScore !== undefined) state.bestScore = d.bestScore;
    if (d.solved) state.solved = d.solved;
    if (d.hintsUsed) state.hintsUsed = d.hintsUsed;
    if (d.wrong) state.wrong = d.wrong;
    if (d.firstTry) state.firstTry = d.firstTry;
    if (d.consecutive !== undefined) state.consecutive = d.consecutive;
    if (d.totalWrong !== undefined) state.totalWrong = d.totalWrong;
    if (d.mode) state.mode = d.mode;
    if (d.timerDuration) state.timerDuration = d.timerDuration;
    if (d.timerEnd !== undefined) state.timerEnd = d.timerEnd;
    if (d.timerStarted !== undefined) state.timerStarted = d.timerStarted;
    if (d.escaped !== undefined) state.escaped = d.escaped;
    if (d.recentApps) state.recentApps = d.recentApps;
    if (d.lang) state.lang = d.lang;
    if (d.settingsToggles) state.settingsToggles = d.settingsToggles;
    if (d.volume !== undefined) state.volume = d.volume;
    if (d.brightness !== undefined) state.brightness = d.brightness;
    return true;
  } catch(e){ return false; }
}
function clearSave(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

/* ============ NOTIFICATIONS ============ */
const N_KEY = 'cyberlock_notifs_v1';
const TOAST_ICONS = { info: ICONS.info, success: ICONS.check, error: ICONS.xcircle, warn: ICONS.alert };
const notifications = {
  items: [],
  init(){
    try {
      const raw = localStorage.getItem(N_KEY);
      if (raw) this.items = JSON.parse(raw) || [];
    } catch(e){ this.items = []; }
  },
  persist(){
    try {
      /* keep only 30 items */
      if (this.items.length > 30) this.items.length = 30;
      localStorage.setItem(N_KEY, JSON.stringify(this.items));
    } catch(e){}
  },
  add(title, message, type){
    const n = { id: 'n' + Date.now() + Math.random().toString(36).slice(2,6), title, message, type: type || 'info', time: Date.now(), read: false };
    this.items.unshift(n);
    this.persist(); this.render(); this.updateBadge();
    return n;
  },
  clear(){ this.items = []; this.persist(); this.render(); this.updateBadge(); },
  markAllRead(){ this.items.forEach(n => n.read = true); this.persist(); this.updateBadge(); this.render(); },
  unreadCount(){ return this.items.filter(n => !n.read).length; },
  updateBadge(){
    const badge = document.getElementById('bell-badge');
    if (!badge) return;
    const c = this.unreadCount();
    if (c > 0) { badge.textContent = c > 9 ? '9+' : String(c); badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  },
  render(){
    const list = document.getElementById('notif-list');
    if (!list) return;
    if (this.items.length === 0) { list.innerHTML = '<div class="notif-empty">Bildiriş yoxdur</div>'; return; }
    list.innerHTML = '';
    const self = this;
    this.items.forEach(n => {
      const item = el('div', 'notif-item' + (n.read ? '' : ' unread'));
      const t = new Date(n.time);
      const timeStr = pad2(t.getHours()) + ':' + pad2(t.getMinutes());
      item.innerHTML =
        '<div class="notif-icon ni-' + n.type + '">' + (TOAST_ICONS[n.type] || ICONS.info) + '</div>' +
        '<div class="notif-body">' +
          '<div class="notif-title">' + n.title + '</div>' +
          '<div class="notif-msg">' + n.message + '</div>' +
          '<div class="notif-time">' + timeStr + '</div>' +
        '</div>';
      item.addEventListener('click', () => { n.read = true; self.persist(); self.updateBadge(); item.classList.remove('unread'); });
      list.appendChild(item);
    });
  }
};

function toast(title, message, type, duration, silent, actionLabel, actionFn){
  type = type || 'info'; duration = duration || 6000;
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = el('div', 'toast t-' + type);
  t.innerHTML =
    '<div class="toast-icon">' + (TOAST_ICONS[type] || ICONS.info) + '</div>' +
    '<div class="toast-body">' +
      '<div class="toast-title">' + title + '</div>' +
      '<div class="toast-msg">' + message + '</div>' +
      (actionLabel ? '<span class="toast-action">' + actionLabel + '</span>' : '') +
    '</div>';
  if (actionFn && actionLabel) {
    t.querySelector('.toast-action').addEventListener('click', function(e){
      e.stopPropagation(); actionFn(); t.remove();
    });
  }
  container.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 240); }, duration);
  if (!silent) notifications.add(title, message, type);
}

/* ============ CONTEXT MENU ============ */
let ctxMenuEl = null;
function showContextMenu(x, y, items){
  hideContextMenu();
  const m = document.getElementById('context-menu');
  m.innerHTML = '';
  items.forEach(it => {
    if (it.sep) { m.appendChild(el('div', 'ctx-sep')); return; }
    const b = el('button', 'ctx-item');
    b.innerHTML = (it.icon ? it.icon : '') + '<span>' + it.label + '</span>';
    b.addEventListener('click', e => { e.stopPropagation(); hideContextMenu(); it.action(); });
    m.appendChild(b);
  });
  m.classList.remove('hidden');
  const rect = m.getBoundingClientRect();
  let px = x, py = y;
  if (px + rect.width > window.innerWidth - 8) px = window.innerWidth - rect.width - 8;
  if (py + rect.height > window.innerHeight - 8) py = window.innerHeight - rect.height - 8;
  m.style.left = Math.max(4, px) + 'px'; m.style.top = Math.max(4, py) + 'px';
  ctxMenuEl = m;
}
function hideContextMenu(){ const m = document.getElementById('context-menu'); if (m) m.classList.add('hidden'); ctxMenuEl = null; }
document.addEventListener('click', e => { if (ctxMenuEl && !ctxMenuEl.contains(e.target)) hideContextMenu(); });
document.addEventListener('contextmenu', e => { if (!e.target.closest('.mail-item')) hideContextMenu(); });

/* ============ MODAL ============ */
function showModal(innerHTML, opts){
  opts = opts || {};
  const backdrop = document.getElementById('modal-backdrop');
  const box = document.getElementById('modal-box');
  box.innerHTML = innerHTML;
  backdrop.classList.remove('hidden');
  backdrop.onclick = e => { if (e.target === backdrop && opts.dismissable !== false) closeModal(); };
}
function closeModal(){ document.getElementById('modal-backdrop').classList.add('hidden'); }

/* ============ TIMER ============ */
function startTimer(){
  if (state.timerStarted) return;
  if (state.timerEnd === null) state.timerEnd = Date.now() + state.timerDuration;
  state.timerStarted = true;
  state.timerRemaining = Math.max(0, state.timerEnd - Date.now());
  updateTimerDisplay();
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(tickTimer, 500);
  tickTimer(); saveState();
}
function stopTimer(){ if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; } }
function tickTimer(){
  if (!state.timerStarted) return;
  const rem = Math.max(0, state.timerEnd - Date.now());
  state.timerRemaining = rem; updateTimerDisplay();
  if (rem <= 0) { stopTimer(); showEndScreen('timeup'); }
}
function updateTimerDisplay(){
  const text = document.getElementById('timer-text');
  const pill = document.getElementById('tray-timer');
  if (!text) return;
  text.textContent = fmtTime(state.timerRemaining);
  if (pill) {
    if (state.timerRemaining <= 60000 && state.timerRemaining > 0 && state.timerStarted && !state.escaped) pill.classList.add('danger');
    else pill.classList.remove('danger');
    if (state.timerStarted) pill.classList.remove('hidden');
  }
}

/* ============ WINDOW MANAGER ============ */
let zTop = 1000;
const openWindows = new Map();

function focusWindow(winEl){
  winEl.style.zIndex = ++zTop;
  document.querySelectorAll('.window').forEach(w => w.classList.toggle('focused', w === winEl));
  const appId = winEl.dataset.appId;
  const rec = openWindows.get(appId);
  document.querySelectorAll('.tb-btn[data-app]').forEach(b => { if (rec) b.classList.toggle('active', b.dataset.app === appId && !rec.minimized); });
  const app = APP_BY_ID[appId];
  if (app && !state.solved[app.taskId]) {
    state.activeTask = app.taskId;
    if (!state.taskStart[app.taskId]) state.taskStart[app.taskId] = Date.now();
    updateHintButton();
  }
}

function openApp(appId){
  const app = APP_BY_ID[appId];
  if (!app) return;
  if (openWindows.has(appId)) {
    const rec = openWindows.get(appId);
    if (rec.minimized) { rec.minimized = false; rec.el.style.display = 'flex'; rec.el.classList.remove('closing'); }
    focusWindow(rec.el); updateHintButton(); return;
  }
  if (!state.timerStarted && !state.escaped) startTimer();

  const sizes = { mail:{w:860,h:560}, security:{w:800,h:600}, browser:{w:880,h:600}, settings:{w:820,h:580}, files:{w:880,h:540} };
  const sz = sizes[appId] || { w:760, h:520 };
  const win = el('div', 'window');
  win.dataset.appId = appId;
  win.style.width = sz.w + 'px';
  win.style.height = sz.h + 'px';
  const cascade = (openWindows.size % 6) * 26;
  let left = Math.max(14, Math.round((window.innerWidth - sz.w) / 2) - 80 + cascade);
  let top = Math.max(14, Math.round((window.innerHeight - 48 - sz.h) / 2) - 20 + cascade);
  if (left + sz.w > window.innerWidth - 120) left = Math.max(14, window.innerWidth - sz.w - 120);
  if (top + sz.h > window.innerHeight - 60) top = Math.max(14, window.innerHeight - sz.h - 60);
  win.style.left = left + 'px';
  win.style.top = top + 'px';

  const tb = el('div', 'win-titlebar');
  tb.innerHTML =
    '<div class="win-icon">' + ICONS[app.icon] + '</div>' +
    '<div class="win-title">' + app.name + '</div>' +
    '<div class="win-controls">' +
      '<button class="win-btn min" title="Minimuma endir">' + ICON_MIN + '</button>' +
      '<button class="win-btn max" title="Maksimuma endir">' + ICON_MAX + '</button>' +
      '<button class="win-btn close" title="Bağla">' + ICON_CLOSE + '</button>' +
    '</div>';
  win.appendChild(tb);
  const body = el('div', 'win-body');
  win.appendChild(body);
  document.getElementById('windows-layer').appendChild(win);

  const rec = { el: win, minimized: false, maximized: false, prevRect: null };
  openWindows.set(appId, rec);

  let dragging = false, dragOffX = 0, dragOffY = 0;
  tb.addEventListener('mousedown', e => {
    if (e.target.closest('.win-btn') || rec.maximized) return;
    dragging = true; dragOffX = e.clientX - win.offsetLeft; dragOffY = e.clientY - win.offsetTop;
    document.body.style.cursor = 'move'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    let nx = e.clientX - dragOffX, ny = e.clientY - dragOffY;
    nx = Math.max(-sz.w + 120, Math.min(nx, window.innerWidth - 120));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 90));
    win.style.left = nx + 'px'; win.style.top = ny + 'px';
  });
  document.addEventListener('mouseup', () => { if (dragging) { dragging = false; document.body.style.cursor = ''; } });

  tb.querySelector('.min').addEventListener('click', e => {
    e.stopPropagation(); rec.minimized = true; win.style.display = 'none';
    document.querySelectorAll('.tb-btn[data-app]').forEach(b => b.classList.remove('active'));
  });
  tb.querySelector('.max').addEventListener('click', e => {
    e.stopPropagation();
    if (!rec.maximized) {
      rec.prevRect = { left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height };
      win.style.left = '0px'; win.style.top = '0px';
      win.style.width = window.innerWidth + 'px';
      win.style.height = (window.innerHeight - 48) + 'px';
      win.style.borderRadius = '0'; rec.maximized = true;
    } else {
      win.style.left = rec.prevRect.left; win.style.top = rec.prevRect.top;
      win.style.width = rec.prevRect.width; win.style.height = rec.prevRect.height;
      win.style.borderRadius = ''; rec.maximized = false;
    }
  });
  tb.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeWindow(appId); });
  win.addEventListener('mousedown', () => focusWindow(win));

  const renderer = RENDERERS[appId];
  if (renderer) renderer(body, app);

  focusWindow(win);
  if (!state.taskStart[app.taskId] && !state.solved[app.taskId]) state.taskStart[app.taskId] = Date.now();
  state.activeTask = app.taskId;
  state.recentApps = state.recentApps.filter(id => id !== appId);
  state.recentApps.unshift(appId);
  if (state.recentApps.length > 5) state.recentApps.length = 5;
  saveState(); refreshTaskbar(); updateHintButton();
}

function closeWindow(appId){
  const rec = openWindows.get(appId);
  if (!rec) return;
  rec.el.classList.add('closing');
  const node = rec.el;
  setTimeout(() => node.remove(), 140);
  openWindows.delete(appId);
  const app = APP_BY_ID[appId];
  if (app && !state.solved[app.taskId]) state.taskStart[app.taskId] = null;
  if (state.activeTask === (app && app.taskId)) state.activeTask = null;
  refreshTaskbar(); updateHintButton();
}
function refreshTaskbar(){
  document.querySelectorAll('.tb-btn[data-app]').forEach(b => {
    const rec = openWindows.get(b.dataset.app);
    b.classList.toggle('active', !!rec && !rec.minimized);
  });
}

/* ============ TASK SOLVING ============ */
function solveTask(taskId){
  if (state.solved[taskId]) return;
  const task = TASKS[taskId];
  if (!task) return;
  const start = state.taskStart[taskId];
  const elapsed = start ? (Date.now() - start) : Infinity;
  const within30s = elapsed <= 30000;
  const isFirstTry = state.firstTry[taskId] !== false;
  if (isFirstTry) state.consecutive = (state.consecutive || 0) + 1;
  else state.consecutive = 0;
  const streakBonus = state.consecutive >= 3;
  let points = task.points;
  if (within30s) points += 20;
  if (streakBonus) points = Math.round(points * 1.2);
  state.solved[taskId] = true;
  state.score += points;
  state.taskStart[taskId] = null;
  if (state.score > state.bestScore) state.bestScore = state.score;
  state.activeTask = null;
  events.emit('task:solved', { taskId, points, within30s, streakBonus, isFirstTry, consecutive: state.consecutive });
  saveState(); updateLockWidget(); updateHintButton(); renderTaskbarScore();
  showDebriefModal(task, points, within30s, streakBonus);
  if (SOLVED_COUNT() >= TASK_ORDER.length) { stopTimer(); setTimeout(() => showEndScreen('escape'), 700); }
}

function registerWrong(taskId, reason){
  if (state.solved[taskId]) return;
  const task = TASKS[taskId];
  if (!task) return;
  state.wrong[taskId] = (state.wrong[taskId] || 0) + 1;
  state.firstTry[taskId] = false;
  state.consecutive = 0;
  state.totalWrong = (state.totalWrong || 0) + 1;
  let penalty = 0;
  if (state.totalWrong > 2) penalty = 10;
  if (penalty > 0) state.score = Math.max(0, state.score - penalty);
  if (taskId === 'password' && state.wrong[taskId] === 3) {
    setTimeout(() => toast('İpucu açıldı', '3 səhv cəhddən sonra ipucu avtomatik göstərildi. Zəif şifrələr: 123456, P@ssw0rd!, qwerty, BlueSky2024.', 'warn', 8000), 400);
  }
  events.emit('task:wrong', { taskId, reason: reason || 'wrong', penalty, totalWrong: state.totalWrong, wrongCount: state.wrong[taskId] });
  saveState(); updateHintButton(); renderTaskbarScore();
  showWrongModal(task, penalty, reason);
}

function useHint(){
  const taskId = state.activeTask;
  if (!taskId) { toast('İpucu', 'Əvvəlcə bir tapşırıq pəncərəsi açın.', 'info', 4000); return; }
  if (state.solved[taskId]) { toast('İpucu', 'Bu tapşırıq artıq həll olunub.', 'info', 3500); return; }
  const task = TASKS[taskId];
  const used = state.hintsUsed[taskId] || 0;
  if (used >= task.hints.length) { toast('İpucu', 'Bu tapşırıq üçün bütün ipuçları istifadə olundu.', 'info', 4000); return; }
  const hint = task.hints[used];
  state.hintsUsed[taskId] = used + 1;
  state.score = Math.max(0, state.score - 15);
  events.emit('hint:used', { taskId, index: used, total: task.hints.length, hint });
  saveState(); renderTaskbarScore();
  const remaining = task.hints.length - (used + 1);
  toast('İpucu — ' + task.title, esc(hint) + (remaining > 0
    ? '<br><br><span style="color:var(--text-3);font-size:10.5px">Daha ' + remaining + ' ipucu var · −15 bal</span>'
    : '<br><br><span style="color:var(--text-3);font-size:10.5px">Son ipucu · −15 bal</span>'), 'warn', 12000);
}

function updateHintButton(){
  const btn = document.getElementById('tray-hint');
  if (!btn) return;
  const taskId = state.activeTask;
  if (!taskId || state.solved[taskId]) {
    btn.classList.add('disabled');
    btn.title = taskId && state.solved[taskId] ? 'Tapşırıq həll olunub' : 'İpucu — əvvəlcə bir tətbiq açın';
  } else {
    btn.classList.remove('disabled');
    const used = state.hintsUsed[taskId] || 0;
    btn.title = 'İpucu: ' + TASKS[taskId].title + ' (' + used + '/' + TASKS[taskId].hints.length + ')';
  }
}

  showModal(
    '<div class="modal-head">' +
      '<div class="mh-icon">' + ICONS.shieldOk + '</div>' +
      '<div><h3>' + task.title + ' — tamamlandı</h3><div class="mh-sub">Debrief · Təhlükəsizlik dərsi</div></div>' +
    '</div>' +
    '<div class="modal-body">' +
      '<div class="debrief-sec"><h4>' + ICONS.info + 'Nə oldu?</h4><p>' + d.what + '</p></div>' +
      '<div class="debrief-sec"><h4>' + ICONS.alert + 'Niyə vacibdir?</h4><p>' + d.why + '</p></div>' +
      '<div class="debrief-sec"><h4>' + ICONS.check + 'Necə qorunmalı?</h4><ul>' + how + '</ul></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<div class="modal-score">+' + points + ' bal' + (bonusBits.length ? ' <span style="color:var(--text-3);font-size:11px">(' + bonusBits.join(' · ') + ')</span>' : '') + '</div>' +

function showWrongModal(task, penalty, reason){
  showModal(
    '<div class="modal-head">' +
      '<div class="mh-icon" style="background:var(--danger-light);color:var(--danger)">' + ICONS.alert + '</div>' +
      '<div><h3>Bu niyə səhv idi?</h3><div class="mh-sub">' + task.title + '</div></div>' +
    '</div>' +
    '<div class="modal-body">' +
      '<div class="debrief-sec"><p>' + (reason ? esc(reason) + '<br><br>' : '') + task.wrongNote + '</p></div>' +
      (penalty > 0
        ? '<div class="cert-warn" style="background:var(--danger-light);border-left-color:var(--danger);color:#7a1a12">−' + penalty + ' bal. İlk 2 səhv cəzasızdır, sonrakılar −10 baldır.</div>'
        : '<div class="cert-warn" style="background:var(--success-light);border-left-color:var(--success);color:#0b4a26">Bu səhv hələ cəzasızdır. Növbəti səhvlər −10 bal olacaq.</div>') +

function shuffle(arr){ const a = arr.slice(); for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

RENDERERS.security = function(body){
  if (state.solved.password) { body.innerHTML = solvedScreen('Tapşırıq tamamlandı', 'Bütün şifrə kartları düzgün kateqoriyalara yerləşdirildi.'); return; }
  const wrap = el('div', 'pw-game');
  wrap.innerHTML =
    '<div class="pw-hintbar">Şifrə kartlarını <strong>Zəif</strong> və ya <strong>Güclü</strong> səbətinə sürükləyin. Diqqət: uzun və simvollu görünən şifrə həmişə güclü olmur.</div>' +
    '<div class="pw-pool" id="pw-pool"></div>' +
    '<div class="pw-zones">' +
      '<div class="pw-zone" data-zone="weak"><div class="pw-zone-title">' + ICONS.xcircle + '<span>Zəif şifrələr</span></div><div class="pw-zone-cards"></div></div>' +
      '<div class="pw-zone" data-zone="strong"><div class="pw-zone-title">' + ICONS.check + '<span>Güclü şifrələr</span></div><div class="pw-zone-cards"></div></div>' +
    '</div>';
  const pool = wrap.querySelector('#pw-pool');
  const zones = wrap.querySelectorAll('.pw-zone');

  shuffle(PW_CARDS).forEach(c => {
    const card = el('div', 'pw-card', c.pw);
    card.dataset.cardId = c.id; card.dataset.correct = c.correct; card.draggable = true;
    card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.id); e.dataTransfer.effectAllowed = 'move'; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    pool.appendChild(card);
  });

  function wireDropZone(zone){
    zone.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      const card = wrap.querySelector('[data-card-id="' + id + '"]');
      if (!card) return;
      const target = zone.querySelector('.pw-zone-cards') || zone;
      target.appendChild(card);
      checkPlacement();
    });
  }
  zones.forEach(wireDropZone);
  wireDropZone(pool);

  function checkPlacement(){
    if (pool.querySelector('.pw-card')) return;
    const wrongCards = [];
    wrap.querySelectorAll('.pw-card').forEach(card => {
      const zone = card.closest('.pw-zone');
      if (!zone) return;
      if (zone.dataset.zone !== card.dataset.correct) wrongCards.push(card);
    });
    if (wrongCards.length === 0) { solveTask('password'); body.innerHTML = solvedScreen('Tapşırıq tamamlandı', 'Düzgün! Bütün şifrələr düzgün kateqoriyalara yerləşdirildi.'); return; }
    registerWrong('password');
    wrongCards.forEach(card => { pool.appendChild(card); card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 520); });
  }
  body.appendChild(wrap);
};

function passwordScore(pw){
  if (!pw) return { level: 0, label: 'Şifrə daxil edin', cls: '' };
  const len = pw.length;
  const hasLower = /[a-z]/.test(pw), hasUpper = /[A-Z]/.test(pw), hasDigit = /[0-9]/.test(pw), hasSymbol = /[^A-Za-z0-9]/.test(pw);
  const classes = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;
  const common = ['password','123456','qwerty','admin','letmein','welcome','azerbaycan','baku'];
  const lower = pw.toLowerCase();
  let isCommon = false;
  for (let i = 0; i < common.length; i++) { if (lower.indexOf(common[i]) !== -1) { isCommon = true; break; } }
  if (isCommon) return { level: 1, label: 'Zəif — ümumi söz istifadə olunur', cls: 's1' };
  if (len < 8) return { level: 1, label: 'Zəif — çox qısa', cls: 's1' };
  if (len >= 12 && classes >= 3) return { level: 4, label: 'Güclü', cls: 's4' };
  if (len >= 10 && classes >= 3) return { level: 3, label: 'Yaxşı', cls: 's3' };
  if (len >= 8 && classes >= 2) return { level: 2, label: 'Orta', cls: 's2' };
  return { level: 1, label: 'Zəif', cls: 's1' };
}

      side.appendChild(btn);
    });
  }

  function renderMain(){
    main.innerHTML = '';
    const panel = state.currentSettingsPanel;

    if (panel === 'accounts') {
      if (state.solved.settings) {
        main.innerHTML = solvedScreen('Tapşırıq tamamlandı', 'Şifrə uğurla dəyişdirildi və güclülük meyarına cavab verdi.');
        return;
      }
      main.innerHTML =
        '<h2>Şifrəni dəyişdir</h2>' +
        '<div class="sm-sub">Hesabınızın təhlükəsizliyi üçün güclü şifrə seçin. Şifrə ən azı 12 simvol olmalı və böyük hərf, kiçik hərf, rəqəm və simvoldan ən azı üçünü ehtiva etməlidir.</div>' +
        '<div class="pw-field"><label>Cari şifrə</label><input type="password" id="curPw" placeholder="Cari şifrəniz" autocomplete="off"></div>' +

        '<div class="strength-wrap"><div class="strength-bars"><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div></div><div class="strength-text" id="strengthText">Şifrə daxil edin</div></div>' +

          '<div class="pw-rule" data-rule="upper"><span class="dot">' + ICONS.check + '</span><span>Böyük hərf (A-Z)</span></div>' +
          '<div class="pw-rule" data-rule="digit"><span class="dot">' + ICONS.check + '</span><span>Rəqəm (0-9)</span></div>' +
          '<div class="pw-rule" data-rule="symbol"><span class="dot">' + ICONS.check + '</span><span>Simvol (!@#$% və s.)</span></div>' +
        '</div>' +
        '<div class="pw-field"><label>Yeni şifrənin təsdiqi</label><input type="password" id="confPw" placeholder="Yeni şifrəni təkrar yazın" autocomplete="off"></div>' +
        '<div class="settings-actions"><button class="tool-btn primary" id="confirmBtn" style="height:36px;padding:0 22px" disabled>Təsdiqlə</button><button class="tool-btn" id="cancelBtn" style="height:36px;padding:0 22px">Ləğv et</button></div>';

      const curPw = main.querySelector('#curPw');
      const newPw = main.querySelector('#newPw');
      const confPw = main.querySelector('#confPw');
      const segs = main.querySelectorAll('.strength-seg');
      const sText = main.querySelector('#strengthText');
      const confirmBtn = main.querySelector('#confirmBtn');
      const rules = main.querySelectorAll('.pw-rule');
      const segColors = ['#c42b1c','#d97706','#b8a600','#0f7b3f'];

      function updateStrength(){
        const val = newPw.value;
        const res = passwordScore(val);
        sText.textContent = res.label;
        sText.className = 'strength-text ' + res.cls;
        segs.forEach((s, i) => { s.style.background = (i < res.level && val) ? segColors[Math.min(res.level - 1, 3)] : '#e2e2e2'; });
        const checks = { len: val.length >= 12, lower: /[a-z]/.test(val), upper: /[A-Z]/.test(val), digit: /[0-9]/.test(val), symbol: /[^A-Za-z0-9]/.test(val) };
        rules.forEach(r => r.classList.toggle('ok', !!checks[r.dataset.rule]));
        const match = val.length > 0 && val === confPw.value;
        confirmBtn.disabled = !(res.level === 4 && match);
      }
      newPw.addEventListener('input', updateStrength);
      confPw.addEventListener('input', updateStrength);
      confirmBtn.addEventListener('click', () => {
        if (state.solved.settings || confirmBtn.disabled) return;
        solveTask('settings');
        renderMain();
      });

      return;

    if (panel === 'network') {

        '<table class="info-table">' +
          '<tr><td>Status</td><td style="color:var(--success);font-weight:600">Bağlı</td></tr>' +

          '<tr><td>MAC</td><td>A4:5E:60:2B:11:CF</td></tr>' +
          '<tr><td>Sürət</td><td>867 Mbps</td></tr>' +
        '</table>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Wi-Fi</div><div class="setting-toggle-desc">Simsiz şəbəkəyə qoşul</div></div><div class="toggle-switch ' + (state.settingsToggles.wifi ? 'on' : '') + '" data-tog="wifi"></div></div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Bluetooth</div><div class="setting-toggle-desc">Yaxınlıqdakı cihazlara qoşul</div></div><div class="toggle-switch ' + (state.settingsToggles.bluetooth ? 'on' : '') + '" data-tog="bluetooth"></div></div>';
      wireToggles(main);
      return;
    }

    if (panel === 'sound') {
      main.innerHTML =
        '<h2>Səs</h2><div class="sm-sub">Səs parametrlərini tənzimləyin.</div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Səs səviyyəsi</div><div class="setting-toggle-desc">Dinamiklərin həcmi</div></div>' +
        '<input type="range" min="0" max="100" value="' + state.volume + '" style="width:180px;accent-color:var(--accent)" id="volRange"></div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Zəng səsi</div><div class="setting-toggle-desc">Bildiriş səsləri</div></div><div class="toggle-switch on" data-tog="ring"></div></div>';
      const volRange = main.querySelector('#volRange');
      volRange.addEventListener('input', () => { state.volume = Number(volRange.value); saveState(); });
      wireToggles(main);
      return;
    }

    if (panel === 'privacy') {
      main.innerHTML =
        '<h2>Məxfilik və Təhlükəsizlik</h2><div class="sm-sub">Məlumatlarınızı və cihazınızı qoruyun.</div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Windows Defender</div><div class="setting-toggle-desc">Real vaxt antivirus müdafiəsi</div></div><div class="toggle-switch on" data-tog="defender"></div></div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Firewall</div><div class="setting-toggle-desc">Şəbəkə trafikini filtrələ</div></div><div class="toggle-switch on" data-tog="firewall"></div></div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">İki faktorlu autentifikasiya</div><div class="setting-toggle-desc">Hesab girişinə əlavə qat</div></div><div class="toggle-switch" data-tog="2fa"></div></div>' +
        '<div class="setting-toggle"><div class="setting-toggle-info"><div class="setting-toggle-label">Telemetriya</div><div class="setting-toggle-desc">Anonim istifadə statistikası</div></div><div class="toggle-switch" data-tog="telemetry"></div></div>';
      wireToggles(main);
      return;
    }
  }

  function wireToggles(container){
    container.querySelectorAll('.toggle-switch').forEach(t => {
      t.addEventListener('click', () => {
        t.classList.toggle('on');
        const key = t.dataset.tog;
        const on = t.classList.contains('on');
        if (key === 'wifi' || key === 'bluetooth') { state.settingsToggles[key] = on; saveState(); }
        const labels = { wifi:'Wi-Fi', bluetooth:'Bluetooth', ring:'Zəng səsi', defender:'Windows Defender', firewall:'Firewall', '2fa':'2FA', telemetry:'Telemetriya' };
        toast('Parametr', (labels[key] || key) + ': ' + (on ? 'aktiv' : 'söndürüldü'), 'info', 3000, true);
      });
    });
  }

  renderSidebar();
  renderMain();
};

RENDERERS.files = function(body){
  if (state.solved.files) { body.innerHTML = solvedScreen('Tapşırıq tamamlandı', 'Şübhəli fayllar uğurla karantinə alındı.'); return; }
  let showExt = false;
  const selected = new Set();

  const wrap = el('div', 'fe-layout');
  const toolbar = el('div', 'app-toolbar');
  toolbar.innerHTML =
    '<button class="tool-btn" id="feNew">' + ICONS.folderNew + '<span>Yeni</span></button>' +
    '<div class="tool-sep"></div>' +
    '<button class="tool-btn" id="feView">' + ICONS.eye + '<span>Görünüş</span>' + ICONS.chevronD + '</button>' +
    '<div class="tool-sep"></div>' +
    '<button class="tool-btn danger" id="feQuarantine" disabled>' + ICONS.security + '<span>Karantinə al</span></button>' +
    '<div style="flex:1"></div>' +
    '<div style="font-size:11.5px;color:var(--text-3);padding-right:4px" id="feCount"></div>';

  const address = el('div', 'fe-address');
  address.innerHTML = '<span class="crumb">Bu Kompüter</span>' + ICONS.chevronR + '<span class="crumb">İstifadəçi</span>' + ICONS.chevronR + '<span class="crumb last">Yükləmələr</span>';

  const filelist = el('div', 'fe-filelist');
  filelist.innerHTML = '<div class="fe-head"><div>Ad</div><div>Dəyişdirilib</div><div>Növ</div><div>Ölçü</div><div></div></div>';
  const rowsHost = el('div');
  filelist.appendChild(rowsHost);

  const statusbar = el('div', 'fe-statusbar');
  statusbar.innerHTML = '<span id="feStatusLeft">6 element</span><span id="feStatusRight"></span>';

  wrap.appendChild(toolbar); wrap.appendChild(address); wrap.appendChild(filelist); wrap.appendChild(statusbar);
  body.appendChild(wrap);

  const quarantineBtn = toolbar.querySelector('#feQuarantine');
  const countEl = toolbar.querySelector('#feCount');

  function renderRows(){
    rowsHost.innerHTML = '';
    FILE_DATA.forEach(f => {
      const name = showExt ? f.full : f.base;
      const type = showExt ? f.typeShown : f.typeHidden;
      const iconKey = (!showExt && f.id === 'f3') ? 'image' : f.icon;
      const row = el('div', 'fe-row' + (selected.has(f.id) ? ' sel' : ''));
      row.innerHTML =
        '<div class="fe-name"><div class="fe-check">' + ICONS.check + '</div><span class="' + FILE_ICON_CLASS[iconKey] + '">' + ICONS[iconKey] + '</span><span>' + name + '</span></div>' +
        '<div style="color:var(--text-3);font-size:11.5px">' + f.date + '</div>' +
        '<div style="color:var(--text-2);font-size:11.5px">' + type + '</div>' +
        '<div style="color:var(--text-3);font-size:11.5px">' + f.size + '</div><div></div>';
      if (f.id === 'f3' && !showExt) row.title = 'Diqqət: Bu fayl əslində .exe uzantılıdır. Uzantıları göstərmək üçün "Görünüş" menyusundan istifadə edin.';
      row.addEventListener('click', () => { if (selected.has(f.id)) selected.delete(f.id); else selected.add(f.id); renderRows(); });
      row.addEventListener('contextmenu', e => {
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, [
          { label:'Aç', icon: ICONS.file, action: () => toast('Simulyasiya', 'Fayl açılmır — təhlükəsizlik simulyasiyası.', 'info', 3000, true) },
          { label:'Xassələr', icon: ICONS.info, action: () => toast(f.full, 'Ölçü: ' + f.size + ' · Dəyişdirilib: ' + f.date + ' · Növ: ' + f.typeShown, 'info', 5000, true) },
          { sep: true },
          { label:'Karantinə al', icon: ICONS.security, action: () => { selected.clear(); selected.add(f.id); renderRows(); quarantineBtn.click(); } }
        ]);
      });
      rowsHost.appendChild(row);
    });
    quarantineBtn.disabled = selected.size === 0;
    countEl.textContent = selected.size > 0 ? (selected.size + ' seçildi') : '';
    statusbar.querySelector('#feStatusLeft').textContent = FILE_DATA.length + ' element';
    statusbar.querySelector('#feStatusRight').textContent = showExt ? 'Uzantılar göstərilir' : 'Uzantılar gizlədilib';
  }

  toolbar.querySelector('#feView').addEventListener('click', e => {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    const menu = el('div', 'fe-viewmenu');
    const item = el('button', 'fe-viewitem' + (showExt ? ' checked' : ''));
    item.innerHTML = '<span class="box">' + ICONS.check + '</span><span>Fayl uzantılarını göstər</span>';
    item.addEventListener('click', ev => {
      ev.stopPropagation(); showExt = !showExt; menu.remove(); renderRows();
      if (showExt) toast('Görünüş dəyişdirildi', 'Fayl uzantıları indi göstərilir. Fayl adlarını diqqətlə yoxlayın.', 'info', 5000);
    });
    menu.appendChild(item);
    document.body.appendChild(menu);
    menu.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
    menu.style.top = (rect.bottom + 4) + 'px';
    setTimeout(() => {
      const closeMenu = ev => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('mousedown', closeMenu); } };
      document.addEventListener('mousedown', closeMenu);
    }, 0);
  });

  toolbar.querySelector('#feNew').addEventListener('click', e => {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    const menu = el('div', 'fe-viewmenu');
    const opts = [
      { icon: ICONS.folderNew, label: 'Yeni qovluq' },
      { icon: ICONS.txt,       label: 'Yeni mətn sənədi' },
      { icon: ICONS.doc,       label: 'Yeni Word sənədi' },
      { sep: true },
      { icon: ICONS.file,      label: 'Fayl yüklə...' }
    ];
    opts.forEach(o => {
      if (o.sep) { menu.appendChild(el('div', 'ctx-sep')); return; }
      const b = el('button', 'fe-viewitem');
      b.innerHTML = '<span style="display:inline-grid;place-items:center;width:18px">' + o.icon + '</span><span>' + o.label + '</span>';
      b.addEventListener('click', ev => {
        ev.stopPropagation(); menu.remove();
        toast('Simulyasiya', 'Bu simulyasiyada yeni fayl yaradılmır. Tapşırıq üçün hazır fayllardan istifadə edin.', 'info', 4500);
      });
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
    menu.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
    menu.style.top = (rect.bottom + 4) + 'px';
    setTimeout(() => {
      const closeMenu = ev => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('mousedown', closeMenu); } };
      document.addEventListener('mousedown', closeMenu);
    }, 0);
  });

  quarantineBtn.addEventListener('click', () => {
    if (state.solved.files || selected.size === 0) return;
    const correctIds = FILE_DATA.filter(f => f.malicious).map(f => f.id);
    const selArr = Array.from(selected);
    const allCorrect = selArr.length === correctIds.length && selArr.every(id => correctIds.indexOf(id) !== -1);
    if (allCorrect) {
      solveTask('files');
      body.innerHTML = solvedScreen('Tapşırıq tamamlandı', 'İkiqat uzantılı "photo.jpg.exe" və naməlum mənbədən gələn "free_vpn_installer.msi" faylları karantinə alındı.');
      return;
    }
    let reason = '';
    const wrongPicks = selArr.filter(id => correctIds.indexOf(id) === -1);
    const missed = correctIds.filter(id => selArr.indexOf(id) === -1);
    if (wrongPicks.length > 0) reason = 'Etibarlı fayl(lar) səhvən seçildi. ';
    if (missed.length > 0) reason += missed.length + ' şübhəli fayl hələ də qovluqdadır. ';
    registerWrong('files', reason);
    selected.clear(); renderRows();
  });

  renderRows();
};

/* ============ DESKTOP ICONS ============ */
function renderDesktopIcons(){
  const host = document.getElementById('desktop-icons');
  host.innerHTML = '';
  APPS.forEach(app => {
    const icon = el('div', 'desktop-icon');
    icon.innerHTML = '<div class="tile" style="background:' + app.grad + '">' + ICONS[app.icon] + '</div><div class="label">' + app.name + '</div>';
    icon.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
      icon.classList.add('selected');
    });
    icon.addEventListener('dblclick', e => {
      e.stopPropagation();
      icon.classList.remove('selected');
      openApp(app.id);
    });
    host.appendChild(icon);
  });
  document.getElementById('wallpaper').addEventListener('click', () => {
    document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  });
}
