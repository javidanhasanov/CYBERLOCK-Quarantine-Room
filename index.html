<!DOCTYPE html>
<html lang="az" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBERLOCK: Quarantine Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#0067c0;--accent-dark:#005a9e;--accent-light:#e5f0fb;
  --win-bg:#f3f3f3;--win-surface:#fff;--win-border:#e5e5e5;
  --text:#1a1a1a;--text-2:#5c5c5c;--text-3:#6b6b6b;
  --danger:#c42b1c;--danger-light:#fdecea;--success:#0f7b3f;--success-light:#e6f4ec;
  --warn:#b26b00;--warn-light:#fff4e0;--radius:8px;
  --taskbar-bg:rgba(243,243,243,.84);
  --titlebar-bg:#f3f3f3;--panel-bg:rgba(243,243,243,.93);
  --hover:rgba(0,0,0,.07);--row-border:#f5f5f5;
  --font:'Segoe UI','Segoe UI Web (West European)',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif;
}
html[data-theme="dark"]{
  --accent:#3b9eff;--accent-dark:#2a86e6;--accent-light:#153052;
  --win-bg:#202020;--win-surface:#2b2b2b;--win-border:#3a3a3a;
  --text:#e8e8e8;--text-2:#b0b0b0;--text-3:#888;
  --danger:#ff6b5e;--danger-light:#3a1512;--success:#4ade80;--success-light:#0d2818;
  --warn:#f0a742;--warn-light:#33270e;
  --taskbar-bg:rgba(32,32,32,.85);
  --titlebar-bg:#2b2b2b;--panel-bg:rgba(32,32,32,.95);
  --hover:rgba(255,255,255,.08);--row-border:#333;
}
html,body{height:100%}
body{font-family:var(--font);overflow:hidden;background:#050a14;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;transition:background .4s}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.5);background-clip:content-box}

/* BOOT */
#boot-screen{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#0d1b33 0%,#050a14 70%);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
#boot-screen.fade{opacity:0;pointer-events:none}
.boot-inner{width:360px;text-align:center}
.boot-logo{width:78px;height:78px;margin:0 auto 26px;color:#4da3ff;filter:drop-shadow(0 0 26px rgba(77,163,255,.55));animation:bootPulse 2.2s ease-in-out infinite}
.boot-logo svg{width:100%;height:100%}
@keyframes bootPulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
.boot-title{font-size:26px;font-weight:600;letter-spacing:.34em;color:#eaf3ff;margin-bottom:8px;padding-left:.34em}
.boot-sub{font-size:12px;color:#6f88a8;letter-spacing:.16em;text-transform:uppercase;margin-bottom:34px}
.boot-status{font-size:12.5px;color:#8fb2d6;min-height:18px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.boot-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
.boot-bar-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#2b7de0,#5ab0ff);transition:width .45s ease}

/* DESKTOP */
#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;transition:background .5s;background:radial-gradient(circle at 22% 26%,rgba(58,120,255,.42),transparent 52%),radial-gradient(circle at 78% 74%,rgba(150,72,255,.34),transparent 52%),radial-gradient(circle at 52% 50%,rgba(0,170,255,.18),transparent 62%),linear-gradient(140deg,#081124 0%,#101d38 45%,#0a1428 100%)}
html[data-theme="dark"] #wallpaper{background:radial-gradient(circle at 22% 26%,rgba(120,60,200,.35),transparent 52%),radial-gradient(circle at 78% 74%,rgba(200,30,90,.28),transparent 52%),radial-gradient(circle at 52% 50%,rgba(0,120,200,.15),transparent 62%),linear-gradient(140deg,#050510 0%,#120820 45%,#080414 100%)}
#wallpaper::after{content:'Think before you click';position:absolute;right:26px;bottom:66px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.14);font-weight:500;pointer-events:none}
#desktop-icons{position:absolute;top:16px;left:14px;display:flex;flex-direction:column;gap:4px;width:96px;z-index:10}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;border-radius:6px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.desktop-icon:hover{background:rgba(255,255,255,.13)}
.desktop-icon.selected{background:rgba(0,103,192,.32);border-color:rgba(77,163,255,.5)}
.desktop-icon .tile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.desktop-icon .tile svg{width:24px;height:24px}
.desktop-icon .label{font-size:11.5px;color:#fff;text-align:center;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.85);word-break:break-word}

/* LOCK WIDGET */
#lock-widget{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:84px;padding:14px 8px 16px;background:rgba(10,16,28,.58);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.14);border-radius:18px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 12px 40px rgba(0,0,0,.42)}
.lw-title{font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:600}
.lw-counter{font-size:17px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lw-counter span{font-size:11px;color:rgba(255,255,255,.45)}
.lw-best{font-size:10px;color:rgba(255,255,255,.5);font-weight:500}
.lw-locks{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.lw-lock{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.28);transition:all .45s cubic-bezier(.34,1.56,.64,1)}
.lw-lock svg{width:22px;height:22px}
.lw-lock.open{color:#4ade80;background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.4);box-shadow:0 0 18px rgba(74,222,128,.35);animation:lockPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes lockPop{0%{transform:scale(.7) rotate(-14deg)}60%{transform:scale(1.16) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.lw-progress{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.lw-progress-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .5s ease}

/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:5000;background:var(--taskbar-bg);-webkit-backdrop-filter:blur(34px) saturate(160%);backdrop-filter:blur(34px) saturate(160%);border-top:1px solid rgba(255,255,255,.15);display:flex;align-items:center;box-shadow:0 -2px 20px rgba(0,0,0,.18);transition:background .4s}
#taskbar-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px}
.tb-btn{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;color:var(--text);transition:background .12s;position:relative}
.tb-btn:hover{background:var(--hover)}
.tb-btn:active{transform:scale(.93)}
.tb-btn.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:var(--accent)}
.tb-btn svg{width:21px;height:21px}
.tb-btn .tb-app-icon{width:21px;height:21px;display:grid;place-items:center}
#start-btn{width:42px;height:42px}
#start-btn svg{width:20px;height:20px}
#system-tray{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:6px;height:100%}
.tray-btn{height:32px;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 9px;color:var(--text);transition:background .12s;font-size:12px;position:relative}
.tray-btn:hover{background:var(--hover)}
.tray-btn svg{width:16px;height:16px}
.tray-btn.active{background:rgba(0,103,192,.18);color:var(--accent)}
#tray-clock{height:32px;border-radius:6px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 10px;font-size:11.5px;line-height:1.32;transition:background .12s;font-variant-numeric:tabular-nums;cursor:pointer}
#tray-clock:hover{background:var(--hover)}
#tray-clock .t2{color:var(--text-2);font-size:10.5px}
#tray-timer{height:32px;border-radius:16px;display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600;transition:background .12s,color .25s;letter-spacing:.02em;border:1px solid transparent;cursor:pointer}
#tray-timer:hover{background:var(--hover)}
#tray-timer svg{width:14px;height:14px}
#tray-timer.danger{color:var(--danger);animation:timerPulse 1s ease-in-out infinite;border-color:rgba(196,43,28,.3);background:rgba(196,43,28,.06)}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.55}}
#tray-hint{color:var(--warn)}
#tray-hint:hover{background:rgba(178,107,0,.12)}
#tray-hint.disabled{color:var(--text-3);opacity:.55}
#tray-theme{color:var(--text)}
.bell-badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1;border:1.5px solid var(--taskbar-bg)}
.virus-badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1;border:1.5px solid var(--taskbar-bg);animation:timerPulse 1s infinite}

/* START MENU */
#start-menu{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);width:492px;max-height:calc(100vh - 90px);z-index:6000;background:var(--panel-bg);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(128,128,128,.2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.42);padding:22px 26px 16px;display:flex;flex-direction:column;animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
@keyframes startIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.sm-search{display:flex;align-items:center;gap:8px;height:34px;background:var(--win-surface);border:1px solid var(--win-border);border-radius:17px;padding:0 13px;margin-bottom:16px;color:var(--text-3);font-size:12.5px;transition:border-color .12s}
.sm-search:focus-within{border-color:var(--accent)}
.sm-search svg{width:15px;height:15px;flex:none}
.sm-search input{flex:1;border:none;outline:none;background:transparent;font-size:12.5px;color:var(--text)}
.sm-section-label{font-size:11.5px;font-weight:600;color:var(--text-3);margin-bottom:8px;margin-top:6px}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:7px;transition:background .12s}
.sm-app:hover{background:var(--hover)}
.sm-app .tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff}
.sm-app .tile svg{width:20px;height:20px}
.sm-app .label{font-size:11px;color:var(--text);text-align:center;line-height:1.2}
.sm-recommended{display:flex;flex-direction:column;gap:1px;margin-bottom:14px;max-height:200px;overflow-y:auto}
.sm-rec-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;transition:background .1s;cursor:pointer;text-align:left;width:100%}
.sm-rec-item:hover{background:var(--hover)}
.sm-rec-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.sm-rec-icon svg{width:16px;height:16px}
.sm-rec-name{font-size:12px;font-weight:500}
.sm-rec-sub{font-size:10.5px;color:var(--text-3)}
.sm-empty{font-size:11.5px;color:var(--text-3);padding:8px 4px}
.sm-footer{border-top:1px solid rgba(128,128,128,.2);padding-top:12px;display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.sm-user{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:500;color:var(--text)}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2b7de0,#7a4dff);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
.sm-power{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);transition:background .12s}
.sm-power:hover{background:var(--hover)}
.sm-power svg{width:17px;height:17px}

/* NOTIFICATION CENTER */
#notif-panel{position:fixed;right:8px;bottom:54px;z-index:6500;width:360px;max-height:480px;display:flex;flex-direction:column;background:var(--panel-bg);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(128,128,128,.2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid rgba(128,128,128,.15);font-size:13px;font-weight:600;flex:none;color:var(--text)}
.notif-head button{font-size:11px;color:var(--accent);font-weight:600;padding:4px 8px;border-radius:4px}
.notif-head button:hover{background:rgba(0,103,192,.15)}
.notif-list{flex:1;overflow-y:auto;padding:6px;min-height:80px}
.notif-empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:12px}
.notif-item{display:flex;gap:10px;padding:10px 12px;border-radius:7px;margin-bottom:3px;transition:background .1s;cursor:pointer}
.notif-item:hover{background:var(--hover)}
.notif-item.unread{background:rgba(0,103,192,.1)}
.notif-icon{width:18px;height:18px;flex:none;margin-top:1px}
.notif-icon svg{width:18px;height:18px}
.notif-icon.ni-info{color:var(--accent)}
.notif-icon.ni-success{color:var(--success)}
.notif-icon.ni-error{color:var(--danger)}
.notif-icon.ni-warn{color:var(--warn)}
.notif-icon.ni-mail{color:#0078d4}
.notif-body{min-width:0;flex:1}
.notif-title{font-size:12px;font-weight:600;margin-bottom:2px;color:var(--text)}
.notif-msg{font-size:11.5px;color:var(--text-2);line-height:1.5;word-break:break-word}
.notif-time{font-size:10px;color:var(--text-3);margin-top:4px}

/* QUICK SETTINGS */
#quick-settings{position:fixed;right:8px;bottom:56px;z-index:6500;width:340px;background:var(--panel-bg);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(128,128,128,.2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:16px;animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
.qs-head{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text)}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.qs-tile{display:flex;align-items:center;gap:9px;padding:10px;border-radius:8px;background:rgba(128,128,128,.16);text-align:left;transition:background .12s,color .12s}
.qs-tile:hover{background:rgba(128,128,128,.28)}
.qs-tile.active{background:var(--accent);color:#fff}
.qs-tile svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.qs-tile.active svg{color:#fff}
.qs-name{font-size:11.5px;font-weight:600;line-height:1.2;color:var(--text)}
.qs-tile.active .qs-name{color:#fff}
.qs-status{font-size:10px;color:var(--text-3);margin-top:1px}
.qs-tile.active .qs-status{color:rgba(255,255,255,.8)}
.qs-slider-row{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:12px;color:var(--text-2)}
.qs-slider-row svg{width:16px;height:16px;flex:none;color:var(--text-2)}
.qs-slider{flex:1;accent-color:var(--accent);cursor:pointer;height:4px}
.qs-slider-val{font-size:11px;color:var(--text-3);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}

/* CALENDAR PANEL */
#calendar-panel{position:fixed;right:8px;bottom:56px;z-index:6500;width:320px;background:var(--panel-bg);-webkit-backdrop-filter:blur(38px) saturate(170%);backdrop-filter:blur(38px) saturate(170%);border:1px solid rgba(128,128,128,.2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:16px;animation:startIn .18s cubic-bezier(.2,.9,.3,1)}
.cal-head{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.cal-head span:last-child{font-size:11px;color:var(--text-3);font-weight:400}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}
.cal-dow{color:var(--text-3);font-weight:600;padding:4px 0;font-size:10px}
.cal-day{padding:6px 0;border-radius:5px;transition:background .1s;cursor:pointer;color:var(--text-2)}
.cal-day:hover{background:var(--hover)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day.other{color:var(--text-3);opacity:.5}
.cal-time{text-align:center;font-size:22px;font-weight:600;margin-bottom:14px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cal-date{text-align:center;font-size:12px;color:var(--text-3);margin-bottom:14px}

/* WINDOWS */
#windows-layer{position:absolute;inset:0;pointer-events:none}
.window{position:absolute;pointer-events:auto;background:var(--win-bg);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(128,128,128,.25);box-shadow:0 18px 60px rgba(0,0,0,.44),0 0 0 1px rgba(0,0,0,.04);animation:winIn .18s cubic-bezier(.2,.9,.3,1);min-width:400px;min-height:280px}
@keyframes winIn{from{opacity:0;transform:scale(.965) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.window.closing{animation:winOut .13s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.96)}}
.win-titlebar{height:40px;flex:none;display:flex;align-items:center;padding-left:14px;gap:10px;background:var(--titlebar-bg);border-bottom:1px solid rgba(128,128,128,.15);cursor:default}
.win-titlebar .win-icon{width:17px;height:17px;display:grid;place-items:center;color:var(--text-2);flex:none}
.win-titlebar .win-icon svg{width:17px;height:17px}
.win-title{font-size:12px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.win-controls{display:flex;flex:none;align-self:stretch}
.win-btn{width:46px;display:grid;place-items:center;color:var(--text);transition:background .1s;align-self:stretch}
.win-btn:hover{background:var(--hover)}
.win-btn.close:hover{background:#c42b1c;color:#fff}
.win-body{flex:1;overflow:hidden;background:var(--win-surface);display:flex;flex-direction:column;min-height:0}

/* TOOLBAR */
.app-toolbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--win-bg);border-bottom:1px solid rgba(128,128,128,.15)}
.tool-btn{height:30px;padding:0 11px;border-radius:5px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--text);transition:background .1s}
.tool-btn:hover{background:var(--hover)}
.tool-btn svg{width:15px;height:15px}
.tool-btn.primary{background:var(--accent);color:#fff}
.tool-btn.primary:hover{background:var(--accent-dark)}
.tool-btn.danger{background:var(--danger);color:#fff}
.tool-btn.danger:hover{background:#a02015}
.tool-btn:disabled{opacity:.42;cursor:not-allowed}
.tool-sep{width:1px;height:20px;background:rgba(128,128,128,.25);margin:0 3px}

/* MAIL */
.mail-layout{flex:1;display:flex;min-height:0}
.mail-list{width:300px;flex:none;border-right:1px solid rgba(128,128,128,.15);overflow-y:auto;background:var(--win-surface)}
.mail-item{padding:11px 14px;border-bottom:1px solid var(--row-border);cursor:pointer;transition:background .1s;position:relative}
.mail-item:hover{background:rgba(0,120,212,.08)}
.mail-item.selected{background:var(--accent-light)}
.mail-item.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.mail-item .mi-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.mail-item .mi-from{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item .mi-time{font-size:10.5px;color:var(--text-3);flex:none}
.mail-item .mi-subject{font-size:12px;color:var(--text-2);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item .mi-preview{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-reader{flex:1;overflow-y:auto;padding:22px 26px;min-width:0;background:var(--win-surface)}
.mail-reader h2{font-size:17px;font-weight:600;margin-bottom:12px;color:var(--text);line-height:1.35}
.mail-meta{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(128,128,128,.2);margin-bottom:18px}
.mail-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;flex:none}
.mail-meta-txt{font-size:12px;line-height:1.5;min-width:0}
.mail-meta-txt .m-name{font-weight:600;color:var(--text)}
.mail-meta-txt .m-addr{color:var(--text-3);font-size:11.5px;word-break:break-all}
.mail-body{font-size:13px;line-height:1.72;color:var(--text-2)}
.mail-body p{margin-bottom:11px}
.mail-body a{color:var(--accent);text-decoration:underline;cursor:pointer}
.mail-empty{flex:1;display:grid;place-items:center;color:var(--text-3);font-size:13px;text-align:center;padding:30px}
.mail-empty svg{width:52px;height:52px;margin:0 auto 12px;opacity:.4}

/* CONTEXT MENU */
#context-menu{position:fixed;z-index:8000;min-width:212px;background:var(--panel-bg);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(128,128,128,.25);border-radius:7px;box-shadow:0 12px 38px rgba(0,0,0,.28);padding:5px;animation:ctxIn .11s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:5px;font-size:12.5px;color:var(--text);text-align:left;transition:background .08s}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-item svg{width:15px;height:15px;flex:none}
.ctx-sep{height:1px;background:rgba(128,128,128,.25);margin:4px 7px}

/* PASSWORD GAME */
.pw-game{flex:1;display:flex;flex-direction:column;padding:18px 20px;gap:14px;overflow-y:auto}
.pw-hintbar{background:var(--accent-light);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 6px 6px 0;font-size:12px;color:var(--text);line-height:1.55}
.pw-pool{min-height:66px;display:flex;flex-wrap:wrap;gap:9px;padding:11px;border-radius:8px;background:rgba(128,128,128,.08);border:1px dashed rgba(128,128,128,.35);align-content:flex-start}
.pw-pool.drag-over{background:rgba(0,103,192,.1);border-color:var(--accent)}
.pw-pool:empty::after{content:'Bütün kartlar yerləşdirildi';font-size:11.5px;color:var(--text-3);margin:auto}
.pw-card{padding:9px 15px;border-radius:7px;background:var(--win-surface);border:1px solid rgba(128,128,128,.3);font-size:12.5px;font-weight:500;font-family:Consolas,'Cascadia Mono',monospace;color:var(--text);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:box-shadow .12s,transform .12s,border-color .12s;letter-spacing:.02em}
.pw-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.18);border-color:var(--accent)}
.pw-card:active{cursor:grabbing}
.pw-card.dragging{opacity:.42;transform:scale(.96)}
.pw-card.shake{animation:shakeX .48s ease}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pw-zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:170px}
.pw-zone{border-radius:9px;border:2px dashed rgba(128,128,128,.35);background:rgba(128,128,128,.05);padding:11px;display:flex;flex-direction:column;gap:8px;transition:all .14s;min-height:150px}
.pw-zone.drag-over{border-color:var(--accent);background:rgba(0,103,192,.1);transform:scale(1.008)}
.pw-zone[data-zone="weak"]{border-color:rgba(196,43,28,.3);background:rgba(196,43,28,.05)}
.pw-zone[data-zone="strong"]{border-color:rgba(15,123,63,.3);background:rgba(15,123,63,.05)}
.pw-zone[data-zone="weak"].drag-over{border-color:var(--danger);background:rgba(196,43,28,.1)}
.pw-zone[data-zone="strong"].drag-over{border-color:var(--success);background:rgba(15,123,63,.1)}
.pw-zone-title{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:7px;padding-bottom:7px;border-bottom:1px solid rgba(128,128,128,.15)}
.pw-zone[data-zone="weak"] .pw-zone-title{color:var(--danger)}
.pw-zone[data-zone="strong"] .pw-zone-title{color:var(--success)}
.pw-zone-title svg{width:14px;height:14px}
.pw-zone-cards{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}

/* BROWSER */
.browser-chrome{flex:none;background:var(--win-bg);border-bottom:1px solid rgba(128,128,128,.2)}
.browser-tabs{display:flex;align-items:flex-end;gap:2px;padding:7px 10px 0;background:rgba(128,128,128,.12);overflow-x:auto;min-height:39px}
.browser-tabs::-webkit-scrollbar{height:0}
.browser-tab{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 14px;border-radius:8px 8px 0 0;background:var(--win-surface);font-size:11.5px;color:var(--text);max-width:200px;min-width:120px;flex:none;cursor:pointer;position:relative;border:1px solid transparent;border-bottom:none}
.browser-tab.active{background:var(--win-bg);box-shadow:inset 0 2px 0 var(--accent)}
.browser-tab .tab-fav{width:13px;height:13px;border-radius:3px;background:var(--accent);flex:none}
.browser-tab .tab-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.browser-tab .tab-close{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;flex:none;opacity:.6}
.browser-tab .tab-close:hover{background:rgba(128,128,128,.3);opacity:1}
.browser-tab .tab-close svg{width:9px;height:9px}
.tab-new-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none;margin-left:4px;color:var(--text-2);align-self:center}
.tab-new-btn:hover{background:var(--hover)}
.tab-new-btn svg{width:14px;height:14px}
.browser-nav{display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--win-bg)}
.bnav-btn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);transition:background .1s}
.bnav-btn:hover{background:var(--hover)}
.bnav-btn svg{width:15px;height:15px}
.address-bar{flex:1;height:30px;border-radius:15px;background:var(--win-surface);border:1px solid rgba(128,128,128,.3);display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;min-width:0;transition:border-color .12s}
.address-bar:focus-within{border-color:var(--accent)}
.padlock-btn{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--text-2);flex:none;transition:background .1s}
.padlock-btn:hover{background:var(--hover)}
.padlock-btn svg{width:14px;height:14px}
.padlock-btn.secure{color:#0f7b3f}
.padlock-btn.insecure{color:var(--warn)}
.padlock-btn.danger{color:var(--danger)}
.url-text{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,'Cascadia Mono',monospace}
.report-site-btn{height:28px;padding:0 13px;border-radius:14px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:600;flex:none;transition:background .12s}
.report-site-btn:hover{background:#a02015}
.report-site-btn:disabled{background:#c9c9c9;cursor:not-allowed}
.browser-content{flex:1;overflow-y:auto;background:var(--win-surface);position:relative;transition:opacity .2s}
.browser-content.refreshing{opacity:.5}
.browser-statusbar{position:absolute;left:0;bottom:0;background:var(--win-bg);border:1px solid rgba(128,128,128,.3);border-left:none;border-bottom:none;border-radius:0 5px 0 0;padding:3px 10px;font-size:11px;color:var(--text-2);font-family:Consolas,'Cascadia Mono',monospace;z-index:5;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* FAKE BANK */
.fake-bank{padding:34px 40px;max-width:520px;margin:0 auto}
.fb-logo{display:flex;align-items:center;gap:11px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid rgba(128,128,128,.2)}
.fb-logo-mark{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,#0b5c3f,#128a5e);display:grid;place-items:center;color:#fff}
.fb-logo-mark svg{width:21px;height:21px}
.fb-logo-name{font-size:17px;font-weight:700;color:var(--success);letter-spacing:.01em}
.fb-logo-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase}
.fb-title{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text)}
.fb-desc{font-size:12px;color:var(--text-3);margin-bottom:20px;line-height:1.6}
.fb-field{margin-bottom:14px}
.fb-field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.fb-field input{width:100%;height:38px;border-radius:7px;border:1px solid rgba(128,128,128,.35);padding:0 12px;font-size:13px;outline:none;transition:border-color .12s;background:var(--win-surface);color:var(--text)}
.fb-field input:focus{border-color:var(--success);background:var(--win-surface)}
.fb-submit{width:100%;height:40px;border-radius:7px;background:#0b5c3f;color:#fff;font-size:13px;font-weight:600;margin-top:6px;transition:background .12s}
.fb-submit:hover{background:#084a32}
.fb-links{display:flex;justify-content:space-between;margin-top:16px;font-size:11.5px}
.fb-links a{color:var(--success);text-decoration:none;cursor:pointer}
.fb-links a:hover{text-decoration:underline}
.fb-note{margin-top:26px;padding:11px 13px;border-radius:6px;background:rgba(178,107,0,.1);border-left:3px solid var(--warn);font-size:11.5px;color:var(--text-2);line-height:1.6}
.download-page{padding:34px 40px;max-width:560px;margin:0 auto}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border-radius:10px;background:linear-gradient(135deg,#e53935,#b71c1c);color:#fff;font-size:15px;font-weight:700;margin:20px 0 14px;box-shadow:0 8px 22px rgba(196,43,28,.35);transition:transform .15s,box-shadow .15s}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(196,43,28,.5)}
.dl-btn svg{width:22px;height:22px}
.dl-warn{margin-top:18px;padding:12px 14px;border-radius:8px;background:rgba(196,43,28,.08);border:1px solid rgba(196,43,28,.3);font-size:11.5px;color:var(--danger);line-height:1.6}

/* VIRUS POPUP */
#virus-popup{position:fixed;inset:0;z-index:8800;display:flex;align-items:center;justify-content:center;background:rgba(60,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadeIn .3s}
.virus-box{width:100%;max-width:440px;background:var(--win-surface);border-radius:12px;border-top:4px solid var(--danger);padding:28px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:winIn .3s}
.virus-box .v-icon{width:64px;height:64px;margin:0 auto 16px;color:var(--danger)}
.virus-box .v-icon svg{width:100%;height:100%}
.virus-box h3{font-size:17px;font-weight:700;color:var(--danger);margin-bottom:8px}
.virus-box p{font-size:12.5px;color:var(--text-2);line-height:1.65;margin-bottom:8px}
.virus-box .v-path{font-family:Consolas,monospace;font-size:11px;background:rgba(128,128,128,.15);padding:6px 10px;border-radius:5px;margin:12px 0;color:var(--text);word-break:break-all}
.virus-box button{margin-top:14px}

/* SETTINGS */
.settings-layout{flex:1;display:flex;min-height:0}
.settings-side{width:220px;flex:none;background:rgba(128,128,128,.06);border-right:1px solid rgba(128,128,128,.2);padding:14px 8px;overflow-y:auto}
.settings-user{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:14px}
.settings-user .su-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2b7de0,#7a4dff);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.settings-user .su-name{font-size:12.5px;font-weight:600;color:var(--text)}
.settings-user .su-mail{font-size:10.5px;color:var(--text-3)}
.side-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:6px;font-size:12.5px;color:var(--text-2);width:100%;text-align:left;transition:background .1s;margin-bottom:2px}
.side-item:hover{background:var(--hover)}
.side-item.active{background:rgba(0,103,192,.15);color:var(--accent);font-weight:600}
.side-item svg{width:16px;height:16px;flex:none}
.settings-main{flex:1;padding:26px 32px;overflow-y:auto}
.settings-main h2{font-size:19px;font-weight:600;margin-bottom:6px;color:var(--text)}
.settings-main .sm-sub{font-size:12px;color:var(--text-3);margin-bottom:24px;line-height:1.6}
.pw-field{margin-bottom:16px;max-width:400px}
.pw-field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.pw-field input{width:100%;height:36px;border-radius:6px;border:1px solid rgba(128,128,128,.35);padding:0 12px;font-size:13px;outline:none;transition:border-color .12s;background:var(--win-surface);color:var(--text)}
.pw-field input:focus{border-color:var(--accent)}
.strength-wrap{max-width:400px;margin-top:4px;margin-bottom:20px}
.strength-bars{display:flex;gap:5px;margin-bottom:7px}
.strength-seg{height:5px;flex:1;border-radius:3px;background:rgba(128,128,128,.25);transition:background .25s}
.strength-text{font-size:11.5px;color:var(--text-3);font-weight:500}
.strength-text.s1{color:var(--danger)}
.strength-text.s2{color:#d97706}
.strength-text.s3{color:#b8a600}
.strength-text.s4{color:var(--success)}
.pw-rules{max-width:400px;margin-bottom:22px;display:flex;flex-direction:column;gap:6px}
.pw-rule{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);transition:color .2s}
.pw-rule .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(128,128,128,.4);flex:none;display:grid;place-items:center;transition:all .2s}
.pw-rule .dot svg{width:9px;height:9px;opacity:0;transition:opacity .2s;color:#fff}
.pw-rule.ok{color:var(--success)}
.pw-rule.ok .dot{background:var(--success);border-color:var(--success)}
.pw-rule.ok .dot svg{opacity:1}
.settings-actions{display:flex;gap:10px;max-width:400px}
.info-table{width:100%;max-width:520px;border-collapse:collapse;font-size:12.5px}
.info-table td{padding:10px 0;border-bottom:1px solid rgba(128,128,128,.15);color:var(--text-2)}
.info-table td:first-child{color:var(--text-3);width:44%}
.setting-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(128,128,128,.15);max-width:520px}
.setting-toggle-info{flex:1}
.setting-toggle-label{font-size:12.5px;font-weight:500;color:var(--text)}
.setting-toggle-desc{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.5}
.toggle-switch{width:38px;height:20px;border-radius:10px;background:rgba(128,128,128,.4);position:relative;transition:background .2s;flex:none;cursor:pointer}
.toggle-switch::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle-switch.on{background:var(--accent)}
.toggle-switch.on::after{transform:translateX(18px)}

/* THEME OPTIONS */
.theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin-bottom:24px}
.theme-card{border-radius:10px;border:2px solid rgba(128,128,128,.25);padding:12px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.theme-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,103,192,.18)}
.theme-preview{height:70px;border-radius:6px;margin-bottom:9px;position:relative;overflow:hidden}
.theme-preview .tp-taskbar{position:absolute;left:0;right:0;bottom:0;height:14px}
.theme-card .tc-name{font-size:12px;font-weight:600;color:var(--text);text-align:center}
.theme-card .tc-check{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.theme-card.active .tc-check{display:grid}
.theme-card .tc-check svg{width:11px;height:11px}

/* FILE EXPLORER */
.fe-layout{flex:1;display:flex;flex-direction:column;min-height:0}
.fe-address{height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--win-bg);border-bottom:1px solid rgba(128,128,128,.2);font-size:12px;color:var(--text-2);overflow-x:auto}
.fe-address::-webkit-scrollbar{height:0}
.fe-address .crumb{padding:3px 7px;border-radius:4px;transition:background .1s;cursor:pointer;white-space:nowrap}
.fe-address .crumb:hover{background:var(--hover)}
.fe-address .crumb.last{font-weight:600;color:var(--text)}
.fe-address .sep{color:var(--text-3);font-size:10px;opacity:.6}
.fe-filelist{flex:1;overflow-y:auto;background:var(--win-surface)}
.fe-head{display:grid;grid-template-columns:1fr 130px 130px 100px 44px;padding:0 14px;height:30px;align-items:center;background:rgba(128,128,128,.06);border-bottom:1px solid rgba(128,128,128,.2);position:sticky;top:0;z-index:2;font-size:11px;font-weight:600;color:var(--text-3)}
.fe-row{display:grid;grid-template-columns:1fr 130px 130px 100px 44px;padding:0 14px;height:38px;align-items:center;border-bottom:1px solid var(--row-border);font-size:12.5px;color:var(--text);cursor:pointer;transition:background .1s;user-select:none}
.fe-row:hover{background:rgba(0,120,212,.08)}
.fe-row.sel{background:var(--accent-light)}
.fe-name{display:flex;align-items:center;gap:9px;min-width:0}
.fe-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe-name svg{width:17px;height:17px;flex:none}
.fe-check{width:15px;height:15px;border-radius:3px;border:1.5px solid rgba(128,128,128,.4);flex:none;display:grid;place-items:center;transition:all .12s;background:var(--win-surface)}
.fe-check svg{width:10px;height:10px;opacity:0;color:#fff}
.fe-row.sel .fe-check{background:var(--accent);border-color:var(--accent)}
.fe-row.sel .fe-check svg{opacity:1}
.icon-pdf{color:#d1342b}
.icon-exe{color:#5b7ea8}
.icon-img{color:#b06bbf}
.icon-doc{color:#2b579a}
.icon-msi{color:#6b6b6b}
.icon-txt{color:var(--text-3)}
.icon-folder{color:#f2b544}
.fe-statusbar{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--win-bg);border-top:1px solid rgba(128,128,128,.2);font-size:11px;color:var(--text-3)}
.fe-empty{flex:1;display:grid;place-items:center;color:var(--text-3);font-size:12px;padding:40px;text-align:center}
.fe-viewmenu{position:absolute;z-index:9000;background:var(--panel-bg);border:1px solid rgba(128,128,128,.25);border-radius:7px;box-shadow:0 12px 38px rgba(0,0,0,.28);padding:5px;min-width:224px;animation:ctxIn .11s ease}
.fe-viewitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:5px;font-size:12px;width:100%;text-align:left;transition:background .1s;color:var(--text)}
.fe-viewitem:hover{background:var(--hover)}
.fe-viewitem .box{width:14px;height:14px;border-radius:3px;border:1.5px solid rgba(128,128,128,.45);flex:none;display:grid;place-items:center;background:var(--win-surface)}
.fe-viewitem.checked .box{background:var(--accent);border-color:var(--accent)}
.fe-viewitem .box svg{width:9px;height:9px;opacity:0;color:#fff}
.fe-viewitem.checked .box svg{opacity:1}

/* FILE VIEWER */
.file-viewer{padding:20px 24px;overflow-y:auto;height:100%;background:var(--win-surface);font-family:Consolas,'Cascadia Mono',monospace;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word}
.file-viewer.img-viewer{display:grid;place-items:center;background:rgba(128,128,128,.12);padding:30px}
.file-viewer.pdf-viewer{font-family:var(--font);white-space:normal;line-height:1.7}
.file-viewer .pdf-page{background:#fff;color:#111;padding:40px 50px;border-radius:3px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:560px;margin:0 auto}
.file-viewer .pdf-page h1{font-size:22px;margin-bottom:18px;color:#111}
.file-viewer .pdf-page p{font-size:13px;margin-bottom:11px;color:#333;line-height:1.75}

/* TOASTS */
#toast-container{position:fixed;right:18px;bottom:64px;z-index:7500;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none;max-width:340px}
.toast{pointer-events:auto;width:100%;background:var(--panel-bg);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(128,128,128,.25);border-radius:9px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:12px 14px;display:flex;gap:11px;animation:toastIn .26s cubic-bezier(.2,.9,.3,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:translateX(0)}}
.toast.out{animation:toastOut .22s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(36px)}}
.toast-icon{width:20px;height:20px;flex:none;margin-top:1px}
.toast-icon svg{width:20px;height:20px}
.toast.t-info .toast-icon{color:var(--accent)}
.toast.t-success .toast-icon{color:var(--success)}
.toast.t-error .toast-icon{color:var(--danger)}
.toast.t-warn .toast-icon{color:var(--warn)}
.toast-body{min-width:0;flex:1}
.toast-title{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.toast-msg{font-size:11.5px;color:var(--text-2);line-height:1.55;word-break:break-word}
.toast-action{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--accent);cursor:pointer}
.toast-action:hover{text-decoration:underline}

/* MODALS */
#modal-backdrop{position:fixed;inset:0;z-index:8500;background:rgba(4,10,20,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#modal-box{width:100%;max-width:600px;max-height:86vh;overflow-y:auto;background:var(--win-surface);border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:modalIn .26s cubic-bezier(.2,.9,.3,1);color:var(--text)}
@keyframes modalIn{from{opacity:0;transform:scale(.955) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{padding:22px 26px 16px;border-bottom:1px solid rgba(128,128,128,.2);display:flex;align-items:flex-start;gap:13px}
.modal-head .mh-icon{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--success-light);color:var(--success)}
.modal-head .mh-icon svg{width:20px;height:20px}
.modal-head h3{font-size:16.5px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3}
.modal-head .mh-sub{font-size:11.5px;color:var(--text-3)}
.modal-body{padding:20px 26px 24px;color:var(--text-2)}
.debrief-sec{margin-bottom:19px}
.debrief-sec:last-of-type{margin-bottom:0}
.debrief-sec h4{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.debrief-sec h4 svg{width:13px;height:13px}
.debrief-sec p{font-size:13px;line-height:1.72;color:var(--text-2)}
.debrief-sec ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:2px;counter-reset:dlist}
.debrief-sec li{font-size:12.5px;line-height:1.6;color:var(--text-2);padding-left:24px;position:relative}
.debrief-sec li::before{content:counter(dlist);counter-increment:dlist;position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:10px;font-weight:700;display:grid;place-items:center}
.modal-foot{padding:16px 26px;border-top:1px solid rgba(128,128,128,.2);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(128,128,128,.05);border-radius:0 0 12px 12px}
.modal-score{font-size:12px;color:var(--text-2)}
.modal-score strong{color:var(--success);font-size:15px;font-weight:700}
.m-btn{height:36px;padding:0 22px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--accent);color:#fff;transition:background .12s}
.m-btn:hover{background:var(--accent-dark)}
.m-btn.ghost{background:transparent;color:var(--text-2);border:1px solid rgba(128,128,128,.4)}
.m-btn.ghost:hover{background:var(--hover)}
.m-btn.danger{background:var(--danger)}
.m-btn.danger:hover{background:#a02015}
.cert-warn{margin-top:16px;padding:12px 14px;border-radius:7px;background:var(--warn-light);border-left:3px solid var(--warn);font-size:12px;color:var(--text-2);line-height:1.65}

/* ESCAPE */
#escape-screen{position:fixed;inset:0;z-index:9500;background:radial-gradient(circle at 50% 30%,#0e2240 0%,#050a14 72%);display:flex;align-items:center;justify-content:center;padding:28px;overflow-y:auto;animation:fadeIn .6s ease}
#escape-screen.timeup{background:radial-gradient(circle at 50% 30%,#2a0e0e 0%,#0a0505 72%)}
.esc-inner{width:100%;max-width:660px;text-align:center;padding:20px 0}
.esc-badge{width:88px;height:88px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(74,222,128,.32),rgba(74,222,128,.06));border:2px solid rgba(74,222,128,.5);display:grid;place-items:center;color:#4ade80;box-shadow:0 0 60px rgba(74,222,128,.35);animation:escPulse 2.6s ease-in-out infinite}
#escape-screen.timeup .esc-badge{background:radial-gradient(circle at 35% 30%,rgba(248,113,113,.3),rgba(248,113,113,.05));border-color:rgba(248,113,113,.5);color:#f87171;box-shadow:0 0 60px rgba(248,113,113,.35)}
.esc-badge svg{width:44px;height:44px}
@keyframes escPulse{0%,100%{box-shadow:0 0 50px rgba(74,222,128,.3)}50%{box-shadow:0 0 84px rgba(74,222,128,.55)}}
.esc-title{font-size:33px;font-weight:700;color:#fff;letter-spacing:.02em;margin-bottom:10px}
.esc-sub{font-size:13.5px;color:#7fa3cc;margin-bottom:32px;line-height:1.7}
.esc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:28px}
.esc-stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:16px 8px}
.esc-stat .es-val{font-size:23px;font-weight:700;color:#eaf3ff;margin-bottom:5px;font-variant-numeric:tabular-nums}
.esc-stat .es-lbl{font-size:10px;color:#6f88a8;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.esc-badges-title{font-size:10.5px;color:#6f88a8;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.esc-badges{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:34px}
.esc-badge-pill{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(77,163,255,.11);border:1px solid rgba(77,163,255,.3);font-size:12px;color:#a8d0ff;font-weight:500}
.esc-badge-pill svg{width:14px;height:14px;color:#4da3ff}
.esc-btn{height:44px;padding:0 34px;border-radius:22px;font-size:13.5px;font-weight:600;background:linear-gradient(135deg,#2b7de0,#5ab0ff);color:#fff;box-shadow:0 10px 30px rgba(43,125,224,.4);transition:transform .15s,box-shadow .15s;margin:0 6px}
.esc-btn:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(43,125,224,.55)}
.esc-btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#a8d0ff;box-shadow:none}
.esc-btn.ghost:hover{background:rgba(255,255,255,.08)}
.esc-note{font-size:11px;color:#4a6280;margin-top:20px;line-height:1.7}
.app-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--text-2)}
.app-done .ad-icon{width:62px;height:62px;border-radius:50%;background:var(--success-light);color:var(--success);display:grid;place-items:center;margin-bottom:16px}
.app-done .ad-icon svg{width:30px;height:30px}
.app-done h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:7px}
.app-done p{font-size:12.5px;line-height:1.65;max-width:340px;color:var(--text-3)}

/* ANTIVIRUS */
.av-panel{padding:24px 28px;flex:1;overflow-y:auto}
.av-hero{display:flex;align-items:center;gap:18px;padding:20px;border-radius:12px;background:var(--success-light);border:1px solid rgba(15,123,63,.2);margin-bottom:22px;transition:all .3s}
.av-hero.infected{background:var(--danger-light);border-color:rgba(196,43,28,.3)}
.av-hero.scanning{background:var(--accent-light);border-color:rgba(0,103,192,.3)}
.av-hero-icon{width:56px;height:56px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;flex:none}
.av-hero.infected .av-hero-icon{background:var(--danger)}
.av-hero.scanning .av-hero-icon{background:var(--accent);animation:timerPulse 1s infinite}
.av-hero-icon svg{width:28px;height:28px}
.av-hero-body{flex:1;min-width:0}
.av-hero-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.av-hero-desc{font-size:12px;color:var(--text-2);line-height:1.55}
.av-hero-actions{display:flex;gap:8px;flex:none}
.av-scan-btn{height:36px;padding:0 18px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--accent);color:#fff;transition:background .12s}
.av-scan-btn:hover{background:var(--accent-dark)}
.av-scan-btn:disabled{opacity:.5;cursor:not-allowed}
.av-clean-btn{height:36px;padding:0 18px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--danger);color:#fff;transition:background .12s}
.av-clean-btn:hover{background:#a02015}
.av-scan-progress{height:6px;border-radius:3px;background:rgba(128,128,128,.2);overflow:hidden;margin-top:12px}
.av-scan-fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#5ab0ff);transition:width .1s linear}
.av-threats{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.av-threat{padding:14px 16px;border-radius:10px;background:var(--danger-light);border:1px solid rgba(196,43,28,.25);display:flex;gap:14px;align-items:flex-start}
.av-threat-icon{width:32px;height:32px;border-radius:8px;background:var(--danger);color:#fff;display:grid;place-items:center;flex:none}
.av-threat-icon svg{width:18px;height:18px}
.av-threat-body{flex:1;min-width:0}
.av-threat-name{font-size:12.5px;font-weight:700;color:var(--danger);margin-bottom:3px;font-family:Consolas,monospace}
.av-threat-path{font-size:11px;color:var(--text-2);word-break:break-all;font-family:Consolas,monospace}
.av-threat-status{font-size:11px;color:var(--text-3);margin-top:5px}
.av-empty{text-align:center;padding:30px;color:var(--text-3);font-size:12px}

@media (max-width:1100px){
  #lock-widget{transform:translateY(-50%) scale(.88);right:8px}
  .window{min-width:340px}
  #notif-panel,#quick-settings,#calendar-panel{width:320px}
  .browser-tab{max-width:140px;min-width:100px}
}

const N_KEY = 'cyberlock_notifs_v3';
const TOAST_ICONS = { info:ICONS.info, success:ICONS.check, error:ICONS.xcircle, warn:ICONS.alert, mail:ICONS.mail };
const notifications = {
  items:[],
  init(){ try { const r = localStorage.getItem(N_KEY); if (r) this.items = JSON.parse(r)||[]; } catch(e){} },
  persist(){ try { if (this.items.length>40) this.items.length=40; localStorage.setItem(N_KEY, JSON.stringify(this.items)); } catch(e){} },
  add(title, message, type){
    const n = { id:uid(), title, message, type:type||'info', time:Date.now(), read:false };
    this.items.unshift(n); this.persist(); this.render(); this.updateBadge(); return n;
  },
  clear(){ this.items=[]; this.persist(); this.render(); this.updateBadge(); },
  markAllRead(){ this.items.forEach(n=>n.read=true); this.persist(); this.updateBadge(); this.render(); },
  unreadCount(){ return this.items.filter(n=>!n.read).length; },
  updateBadge(){
    const badge = document.getElementById('bell-badge');
    if (!badge) return;
    const c = this.unreadCount();
    if (c>0){ badge.textContent = c>9?'9+':String(c); badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  },
  render(){
    const list = document.getElementById('notif-list');
    if (!list) return;
    if (this.items.length===0){ list.innerHTML = '<div class="notif-empty">Bildiriş yoxdur</div>'; return; }
    list.innerHTML='';
    const self = this;
    this.items.forEach(n => {
      const item = el('div','notif-item'+(n.read?'':' unread'));
      const t = new Date(n.time);
      item.innerHTML = '<div class="notif-icon ni-'+n.type+'">'+(TOAST_ICONS[n.type]||ICONS.info)+'</div>'+
        '<div class="notif-body"><div class="notif-title">'+n.title+'</div><div class="notif-msg">'+n.message+'</div><div class="notif-time">'+pad2(t.getHours())+':'+pad2(t.getMinutes())+'</div></div>';
      item.addEventListener('click', () => { n.read = true; self.persist(); self.updateBadge(); item.classList.remove('unread'); });
      list.appendChild(item);
    });
  }
};
function toast(title, message, type, duration, silent, actionLabel, actionFn){
  type = type||'info'; duration = duration||6000;
  const c = document.getElementById('toast-container');
  if (!c) return;
  const t = el('div','toast t-'+type);
  t.innerHTML = '<div class="toast-icon">'+(TOAST_ICONS[type]||ICONS.info)+'</div>'+
    '<div class="toast-body"><div class="toast-title">'+title+'</div><div class="toast-msg">'+message+'</div>'+
    (actionLabel?'<span class="toast-action">'+actionLabel+'</span>':'')+'</div>';
  if (actionFn && actionLabel){
    t.querySelector('.toast-action').addEventListener('click', e => { e.stopPropagation(); actionFn(); t.remove(); });
  }
  c.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(),240); }, duration);
  if (!silent) notifications.add(title, message, type);
}

let ctxMenuEl = null;
function showContextMenu(x, y, items){
  hideContextMenu();
  const m = document.getElementById('context-menu');
  m.innerHTML = '';
  items.forEach(it => {
    if (it.sep){ m.appendChild(el('div','ctx-sep')); return; }
    const b = el('button','ctx-item');
    b.innerHTML = (it.icon||'')+'<span>'+it.label+'</span>';
    b.addEventListener('click', e => { e.stopPropagation(); hideContextMenu(); it.action(); });
    m.appendChild(b);
  });
  m.classList.remove('hidden');
  const r = m.getBoundingClientRect();
  let px=x, py=y;
  if (px+r.width > window.innerWidth-8) px = window.innerWidth-r.width-8;
  if (py+r.height > window.innerHeight-8) py = window.innerHeight-r.height-8;
  m.style.left = Math.max(4,px)+'px'; m.style.top = Math.max(4,py)+'px';
  ctxMenuEl = m;
}
function hideContextMenu(){
  const m = document.getElementById('context-menu');
  if (m) m.classList.add('hidden');
  ctxMenuEl = null;
}
document.addEventListener('click', e => { if (ctxMenuEl && !ctxMenuEl.contains(e.target)) hideContextMenu(); });

/* ============ TIMER ============ */
function startTimer(){
  if (state.timerStarted) return;
  if (state.timerEnd===null) state.timerEnd = Date.now()+state.timerDuration;
  state.timerStarted = true;
  state.timerRemaining = Math.max(0, state.timerEnd-Date.now());
  updateTimerDisplay();
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(tickTimer, 500);
  tickTimer(); saveState();
}
function stopTimer(){ if (state.timerInterval){ clearInterval(state.timerInterval); state.timerInterval=null; } }
function tickTimer(){
  if (!state.timerStarted) return;
  const rem = Math.max(0, state.timerEnd-Date.now());
  state.timerRemaining = rem; updateTimerDisplay();
  if (rem<=0){ stopTimer(); showEndScreen('timeup'); }
}
function updateTimerDisplay(){
  const txt = document.getElementById('timer-text');
  const pill = document.getElementById('tray-timer');
  if (!txt) return;
  txt.textContent = fmtTime(state.timerRemaining);
  if (pill){
    if (state.timerRemaining<=60000 && state.timerRemaining>0 && state.timerStarted && !state.escaped) pill.classList.add('danger');
    else pill.classList.remove('danger');
    if (state.timerStarted) pill.classList.remove('hidden');
  }
}

/* ============ WINDOW MANAGER ============ */
let zTop = 1000;
const openWindows = new Map();
function focusWindow(winEl){
  winEl.style.zIndex = ++zTop;
  document.querySelectorAll('.window').forEach(w=>w.classList.toggle('focused', w===winEl));
  const appId = winEl.dataset.appId;
  const rec = openWindows.get(appId);
  document.querySelectorAll('.tb-btn[data-app]').forEach(b => { if (rec) b.classList.toggle('active', b.dataset.app===appId && !rec.minimized); });
  const app = APP_BY_ID[appId];
  if (app && !state.solved[app.taskId]){
    state.activeTask = app.taskId;
    if (!state.taskStart[app.taskId]) state.taskStart[app.taskId] = Date.now();
    updateHintButton();
  }
}
function openApp(appId){
  const app = APP_BY_ID[appId];
  if (!app) return;
  if (openWindows.has(appId)){
    const rec = openWindows.get(appId);
    if (rec.minimized){ rec.minimized=false; rec.el.style.display='flex'; rec.el.classList.remove('closing'); }
    focusWindow(rec.el); updateHintButton(); return;
  }
  if (!state.timerStarted && !state.escaped) startTimer();
  const sizes = { mail:{w:880,h:580}, security:{w:880,h:620}, browser:{w:980,h:640}, settings:{w:860,h:600}, files:{w:920,h:580} };
  const sz = sizes[appId] || {w:760,h:520};
  const win = el('div','window');
  win.dataset.appId = appId;
  win.style.width = sz.w+'px'; win.style.height = sz.h+'px';
  const cascade = (openWindows.size%6)*26;
  let left = Math.max(14, Math.round((window.innerWidth-sz.w)/2)-80+cascade);
  let top = Math.max(14, Math.round((window.innerHeight-48-sz.h)/2)-20+cascade);
  if (left+sz.w>window.innerWidth-120) left = Math.max(14, window.innerWidth-sz.w-120);
  if (top+sz.h>window.innerHeight-60) top = Math.max(14, window.innerHeight-sz.h-60);
  win.style.left = left+'px'; win.style.top = top+'px';

  const tb = el('div','win-titlebar');
  tb.innerHTML = '<div class="win-icon">'+ICONS[app.icon]+'</div><div class="win-title">'+app.name+'</div>'+
    '<div class="win-controls"><button class="win-btn min">'+ICON_MIN+'</button><button class="win-btn max">'+ICON_MAX+'</button><button class="win-btn close">'+ICON_CLOSE+'</button></div>';
  win.appendChild(tb);
  const body = el('div','win-body');
  win.appendChild(body);
  document.getElementById('windows-layer').appendChild(win);

  const rec = { el:win, minimized:false, maximized:false, prevRect:null };
  openWindows.set(appId, rec);

  let dragging=false, dX=0, dY=0;
  tb.addEventListener('mousedown', e => {
    if (e.target.closest('.win-btn') || rec.maximized) return;
    dragging=true; dX=e.clientX-win.offsetLeft; dY=e.clientY-win.offsetTop;
    document.body.style.cursor='move'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    let nx=e.clientX-dX, ny=e.clientY-dY;
    nx = Math.max(-sz.w+120, Math.min(nx, window.innerWidth-120));
    ny = Math.max(0, Math.min(ny, window.innerHeight-90));
    win.style.left=nx+'px'; win.style.top=ny+'px';
  });
  document.addEventListener('mouseup', () => { if (dragging){ dragging=false; document.body.style.cursor=''; } });
  tb.querySelector('.min').addEventListener('click', e => { e.stopPropagation(); rec.minimized=true; win.style.display='none'; document.querySelectorAll('.tb-btn[data-app]').forEach(b=>b.classList.remove('active')); });
  tb.querySelector('.max').addEventListener('click', e => {
    e.stopPropagation();
    if (!rec.maximized){
      rec.prevRect = { left:win.style.left, top:win.style.top, width:win.style.width, height:win.style.height };
      win.style.left='0px'; win.style.top='0px'; win.style.width=window.innerWidth+'px'; win.style.height=(window.innerHeight-48)+'px';
      win.style.borderRadius='0'; rec.maximized=true;
    } else {
      win.style.left=rec.prevRect.left; win.style.top=rec.prevRect.top; win.style.width=rec.prevRect.width; win.style.height=rec.prevRect.height;
      win.style.borderRadius=''; rec.maximized=false;
    }
  });
  tb.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeWindow(appId); });
  win.addEventListener('mousedown', () => focusWindow(win));

  const renderer = RENDERERS[appId];
  if (renderer) renderer(body, app);

  focusWindow(win);
  if (!state.taskStart[app.taskId] && !state.solved[app.taskId]) state.taskStart[app.taskId] = Date.now();
  state.activeTask = app.taskId;
  state.recentApps = state.recentApps.filter(id=>id!==appId);
  state.recentApps.unshift(appId);
  if (state.recentApps.length>5) state.recentApps.length=5;
  saveState(); refreshTaskbar(); updateHintButton();
}
function closeWindow(appId){
  const rec = openWindows.get(appId);
  if (!rec) return;
  rec.el.classList.add('closing');
  const node = rec.el;
  setTimeout(()=>node.remove(), 140);
  openWindows.delete(appId);
  const app = APP_BY_ID[appId];
  if (app && !state.solved[app.taskId]) state.taskStart[app.taskId] = null;
  if (state.activeTask === (app && app.taskId)) state.activeTask = null;
  refreshTaskbar(); updateHintButton();
}
function refreshTaskbar(){
  document.querySelectorAll('.tb-btn[data-app]').forEach(b => {
    const rec = openWindows.get(b.dataset.app);
    b.classList.toggle('active', !!rec && !rec.minimized);
  });
}

/* ============ TASK SOLVING ============ */
function solveTask(taskId){
  if (state.solved[taskId]) return;
  const task = TASKS[taskId];
  if (!task) return;
  const start = state.taskStart[taskId];
  const elapsed = start ? (Date.now()-start) : Infinity;
  const within30s = elapsed <= 30000;
  const isFirstTry = state.firstTry[taskId] !== false;
  if (isFirstTry) state.consecutive = (state.consecutive||0)+1;
  else state.consecutive = 0;
  const streakBonus = state.consecutive >= 3;
  let points = task.points;
  if (within30s) points += 20;
  if (streakBonus) points = Math.round(points*1.2);
  state.solved[taskId] = true;
  state.score += points;
  state.taskStart[taskId] = null;
  if (state.score > state.bestScore) state.bestScore = state.score;
  state.activeTask = null;
  saveState(); updateLockWidget(); updateHintButton(); renderTaskbarScore();
  showDebriefModal(task, points, within30s, streakBonus);
  if (SOLVED_COUNT() >= TASK_ORDER.length){ stopTimer(); setTimeout(()=>showEndScreen('escape'), 700); }
}
function registerWrong(taskId, reason){
  if (state.solved[taskId]) return;
  const task = TASKS[taskId];
  if (!task) return;
  state.wrong[taskId] = (state.wrong[taskId]||0)+1;
  state.firstTry[taskId] = false;
  state.consecutive = 0;
  state.totalWrong = (state.totalWrong||0)+1;
  let penalty = 0;
  if (state.totalWrong > 2) penalty = 10;
  if (penalty > 0) state.score = Math.max(0, state.score-penalty);
  saveState(); updateHintButton(); renderTaskbarScore();
  showWrongModal(task, penalty, reason);
}
function useHint(){
  const taskId = state.activeTask;
  if (!taskId){ toast('İpucu', 'Əvvəlcə bir tapşırıq pəncərəsi açın.', 'info', 4000); return; }
  if (state.solved[taskId]){ toast('İpucu', 'Bu tapşırıq artıq həll olunub.', 'info', 3500); return; }
  const task = TASKS[taskId];
  const used = state.hintsUsed[taskId]||0;
  if (used >= task.hints.length){ toast('İpucu', 'Bu tapşırıq üçün bütün ipuçları istifadə olundu.', 'info', 4000); return; }
  const hint = task.hints[used];
  state.hintsUsed[taskId] = used+1;
  state.score = Math.max(0, state.score-15);
  saveState(); renderTaskbarScore();
  const rem = task.hints.length-(used+1);
  toast('İpucu — '+task.title, esc(hint)+(rem>0?'<br><br><span style="color:var(--text-3);font-size:10.5px">Daha '+rem+' ipucu var · −15 bal</span>':'<br><br><span style="color:var(--text-3);font-size:10.5px">Son ipucu · −15 bal</span>'), 'warn', 12000);
}
function updateHintButton(){
  const btn = document.getElementById('tray-hint');
  if (!btn) return;
  const taskId = state.activeTask;
  if (!taskId || state.solved[taskId]){
    btn.classList.add('disabled');
    btn.title = (taskId && state.solved[taskId]) ? 'Tapşırıq həll olunub' : 'İpucu — əvvəlcə bir tətbiq açın';
  } else {
    btn.classList.remove('disabled');
    const used = state.hintsUsed[taskId]||0;
    btn.title = 'İpucu: '+TASKS[taskId].title+' ('+used+'/'+TASKS[taskId].hints.length+')';
  }
}

/* --- FILE EXPLORER --- */
function getFolderByPath(pathArr){
  let node = { name:'This PC', type:'folder', children: FS.children, path:[] };
  // FS is the root "This PC"
  let cur = FS;
  for (const seg of pathArr){
    if (cur.children && cur.children[seg]) cur = cur.children[seg];
    else return null;
  }
  return cur;
}
function extIcon(ext){
  const map = { txt:'icon-txt', pdf:'icon-pdf', exe:'icon-exe', msi:'icon-msi', jpg:'icon-img', png:'icon-img', doc:'icon-doc', docx:'icon-doc' };
  const iconMap = { txt:ICONS.txt, pdf:ICONS.pdf, exe:ICONS.exe, msi:ICONS.msi, jpg:ICONS.image, png:ICONS.image, doc:ICONS.doc, docx:ICONS.doc };
  return { cls: map[ext]||'icon-txt', svg: iconMap[ext]||ICONS.file };
}
function openFile(file){
  if (!file) return;
  const ext = (file.ext||'').toLowerCase();
  if (ext==='txt'){
    showModal('<div class="modal-head"><div class="mh-icon" style="background:var(--accent-light);color:var(--accent)">'+ICONS.txt+'</div><div><h3>'+esc(file.name)+'</h3><div class="mh-sub">Notepad · '+file.size+'</div></div></div>'+
      '<div class="modal-body" style="padding:0"><div style="padding:20px 26px;max-height:60vh;overflow-y:auto;font-family:Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--text)">'+esc(file.content||'(boş fayl)')+'</div></div>'+
      '<div class="modal-foot"><div class="modal-score">Son dəyişiklik: '+file.modified+'</div><button class="m-btn" onclick="document.getElementById(\'modal-backdrop\').classList.add(\'hidden\')">Bağla</button></div>');
    return;
  }
  if (ext==='jpg'||ext==='png'){
    showModal('<div class="modal-head"><div class="mh-icon">'+ICONS.image+'</div><div><h3>'+esc(file.name)+'</h3><div class="mh-sub">Şəkil · '+file.size+'</div></div></div>'+
      '<div class="modal-body" style="padding:20px;text-align:center;background:rgba(128,128,128,.1)">'+ (file.content||'<div style="padding:40px;color:var(--text-3)">Şəkil önizləməsi</div>') +'</div>'+
      '<div class="modal-foot"><div class="modal-score">'+file.modified+'</div><button class="m-btn" onclick="document.getElementById(\'modal-backdrop\').classList.add(\'hidden\')">Bağla</button></div>');
    return;
  }
  if (ext==='pdf'){
    showModal('<div class="modal-head"><div class="mh-icon" style="background:var(--danger-light);color:var(--danger)">'+ICONS.pdf+'</div><div><h3>'+esc(file.name)+'</h3><div class="mh-sub">PDF · '+file.size+'</div></div></div>'+
      '<div class="modal-body" style="padding:20px;background:rgba(128,128,128,.1)">'+ (file.content||'<p>PDF önizləməsi</p>') +'</div>'+
      '<div class="modal-foot"><div class="modal-score">'+file.modified+'</div><button class="m-btn" onclick="document.getElementById(\'modal-backdrop\').classList.add(\'hidden\')">Bağla</button></div>');
    return;
  }
  if (ext==='exe'||ext==='msi'){
    if (file.suspicious){
      showModal('<div class="modal-head"><div class="mh-icon" style="background:var(--danger-light);color:var(--danger)">'+ICONS.alert+'</div><div><h3>⚠ Şübhəli fayl</h3><div class="mh-sub">'+esc(file.name)+'</div></div></div>'+
        '<div class="modal-body"><div class="debrief-sec"><h4>'+ICONS.alert+'Şübhə səbəbi</h4><p>'+esc(file.suspiciousReason||'Bu fayl şübhəlidir.')+'</p>'+
        '<div class="cert-warn" style="background:var(--danger-light);border-left-color:var(--danger);color:var(--danger);margin-top:14px"><strong>Tövsiyə:</strong> Bu faylı açmayın. Security Center → Antivirus bölməsindən skan edib silin.</div></div></div>'+
        '<div class="modal-foot"><div class="modal-score">Risk: <strong style="color:var(--danger)">Yüksək</strong></div><button class="m-btn" onclick="document.getElementById(\'modal-backdrop\').classList.add(\'hidden\')">Bağla</button></div>');
      return;
    }
    toast('Fayl icra olunur', '"'+esc(file.name)+'" başladılır... (simulyasiya)', 'info', 3000);
    return;
  }
  showModal('<div class="modal-head"><div class="mh-icon">'+ICONS.file+'</div><div><h3>'+esc(file.name)+'</h3><div class="mh-sub">'+(ext?ext.toUpperCase()+' faylı':'Fayl')+'</div></div></div>'+
    '<div class="modal-body"><p style="font-size:13px;color:var(--text-2);line-height:1.7">Bu fayl növü simulyasiyada açılmır.</p><div class="cert-warn" style="margin-top:14px">Fayl: <code style="font-family:Consolas,monospace">'+esc(file.name)+'</code><br>Ölçü: '+file.size+'<br>Dəyişdirildi: '+file.modified+'</div></div>'+
    '<div class="modal-foot"><button class="m-btn" onclick="document.getElementById(\'modal-backdrop\').classList.add(\'hidden\')">Bağla</button></div>');
}

RENDERERS.files = function(body){
  const wrap = el('div','fe-layout');
  const toolbar = el('div','app-toolbar');
  toolbar.innerHTML =
    '<button class="tool-btn" id="feBack">'+ICONS.back+'<span>Geri</span></button>'+
    '<button class="tool-btn" id="feUp">'+ICONS.forward+'<span>Yuxarı</span></button>'+

    '<button class="tool-btn" id="feNewFile">'+ICONS.fileNew+'<span>Yeni sənəd</span></button>'+
    '<div class="tool-sep"></div>'+
    '<button class="tool-btn" id="feRefresh">'+ICONS.refresh+'<span>Yenilə</span></button>'+
    '<button class="tool-btn" id="feShowExt" style="margin-left:auto">'+ICONS.eye+'<span>Uzantılar</span></button>';
  wrap.appendChild(toolbar);
  const address = el('div','fe-address');
  wrap.appendChild(address);
  const fileList = el('div','fe-filelist');
  wrap.appendChild(fileList);
  const status = el('div','fe-statusbar');
  wrap.appendChild(status);
  body.appendChild(wrap);

  function renderBreadcrumb(){
    address.innerHTML = '';
    const parts = ['This PC', ...currentPath];
    const fullPath = currentPath.slice();
    parts.forEach((p, i) => {
      const c = el('span','crumb'+(i===parts.length-1?' last':''), p);
      c.addEventListener('click', () => {
        currentPath = fullPath.slice(0, i);
        selectedFiles.clear(); render();
      });
      address.appendChild(c);
      if (i < parts.length-1) address.appendChild(el('span','sep', ICONS.chevronR));
    });
  }
  function render(){
    renderBreadcrumb();
    fileList.innerHTML = '';
    const folder = getFolderByPath(currentPath);
    if (!folder || folder.type!=='folder'){
      fileList.innerHTML = '<div class="fe-empty">Qovluq tapılmadı</div>';
      status.textContent = '0 element';
      return;
    }
    const items = Object.values(folder.children||{});
    if (items.length===0){
      fileList.innerHTML = '<div class="fe-empty">Bu qovluq boşdur</div>';
      status.textContent = '0 element';
      return;
    }
    // header
    const head = el('div','fe-head');
    head.innerHTML = '<div>Ad</div><div>Dəyişdirildi</div><div>Növ</div><div>Ölçü</div><div></div>';
    fileList.appendChild(head);

    items.sort((a,b) => {
      if (a.type !== b.type) return a.type==='folder' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    items.forEach(item => {
      const row = el('div','fe-row');
      let displayName = item.name;
      let iconInfo;
      let typeLabel;
      let sizeLabel;
      if (item.type==='folder'){
        iconInfo = { cls:'icon-folder', svg:ICONS.folder };
        typeLabel = 'Qovluq';
        sizeLabel = '—';
      } else {
        iconInfo = extIcon(item.ext);
        typeLabel = (item.ext||'Fayl').toUpperCase() + ' faylı';
        sizeLabel = item.size||'—';
        if (!showExtensions && item.ext){
          // hide extensions visually
          const parts = item.name.split('.');
          if (parts.length>1){ const ext = parts.pop(); displayName = parts.join('.'); if (!displayName) displayName = item.name; }
        }
      }
      if (item.suspicious) displayName = '⚠ ' + displayName;
      row.innerHTML = '<div class="fe-name"><div class="fe-check">'+ICONS.check+'</div><div class="'+iconInfo.cls+'">'+iconInfo.svg+'</div><span>'+esc(displayName)+'</span></div>'+
        '<div style="color:var(--text-3);font-size:11.5px">'+(item.modified||'—')+'</div>'+
        '<div style="color:var(--text-3);font-size:11.5px">'+typeLabel+'</div>'+
        '<div style="color:var(--text-3);font-size:11.5px">'+sizeLabel+'</div>'+
        '<div></div>';
      if (selectedFiles.has(item.name)) row.classList.add('sel');
      row.addEventListener('click', () => {
        if (item.type==='folder'){
          currentPath = [...currentPath, item.name];
          selectedFiles.clear(); render();
        } else {
          if (selectedFiles.has(item.name)) { selectedFiles.delete(item.name); row.classList.remove('sel'); }
          else { selectedFiles.add(item.name); row.classList.add('sel'); }
          status.textContent = selectedFiles.size + ' element seçilib';
        }
      });
      row.addEventListener('dblclick', () => {
        if (item.type==='folder'){ currentPath = [...currentPath, item.name]; selectedFiles.clear(); render(); }
        else openFile(item);
      });
      row.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        selectedFiles.clear(); selectedFiles.add(item.name);
        render();
        const items = item.type==='folder' ? [
          { label:'Aç', icon:ICONS.folder, action:()=>{ currentPath=[...currentPath,item.name]; selectedFiles.clear(); render(); } },
          { sep:true },
          { label:'Sil', icon:ICONS.trash, action:()=>deleteItem(item) },
          { label:'Xüsusiyyətlər', icon:ICONS.info, action:()=>showProps(item) }
        ] : [
          { label:'Aç', icon:ICONS.file, action:()=>openFile(item) },
          { label:'Sil', icon:ICONS.trash, action:()=>deleteItem(item) },
          { sep:true },
          { label:'Xüsusiyyətlər', icon:ICONS.info, action:()=>showProps(item) }
        ];
        // Add "report suspicious" if suspicious
        if (item.suspicious && !state.solved.files){
          items.unshift({ label:'Şübhəli kimi bildir', icon:ICONS.alert, action:()=>reportSuspicious(item) });
        }
        showContextMenu(e.clientX, e.clientY, items);
      });
      fileList.appendChild(row);
    });
    status.textContent = items.length + ' element';
  }
  function deleteItem(item){
    if (item.name==='Notes.txt' || item.name==='report.pdf' || item.name==='budget.xlsx' || item.name==='vacation.jpg'){
      toast('Silmə qadağandır', 'Bu sistem faylı silinə bilməz.', 'warn', 3000); return;
    }
    const folder = getFolderByPath(currentPath);
    if (folder && folder.children && folder.children[item.name]){
      delete folder.children[item.name];
      selectedFiles.clear(); render();
      toast('Silindi', '"'+item.name+'" silindi.', 'info', 2500, true);
    }
  }
  function showProps(item){
    showModal('<div class="modal-head"><div class="mh-icon">'+ICONS.file+'</div><div><h3>'+esc(item.name)+'</h3><div class="mh-sub">Xüsusiyyətlər</div></div></div>'+
      '<div class="modal-body"><table class="info-table"><tr><td>Ad</td><td>'+esc(item.name)+'</td></tr>'+
      '<tr><td>Növ</td><td>'+(item.type==='folder'?'Qovluq':((item.ext||'fayl').toUpperCase()+' faylı'))+'</td></tr>'+
      '<tr><td>Ölçü</td><td>'+(item.size||'—')+'</td></tr>'+
      '<tr><td>Dəyişdirildi</td><td>'+(item.modified||'—')+'</td></tr>'+
      (item.suspicious?'<tr><td>Risk</td><td style="color:var(--danger)">⚠ Şübhəli</td></tr>':'')+
      '</table></div>'+
      '<div class="modal-foot"><button class="m-btn" onclick="document.getElementById(\'modal-backdrop\').classList.add(\'hidden\')">Bağla</button></div>');
  }
  function reportSuspicious(item){
    if (state.solved.files) return;
    // Correct answers are: photo.jpg.exe (double extension) and free_vpn_installer.msi (unknown source)
    if (item.suspicious){
      // Check if both flagged
      if (item.name==='photo.jpg.exe'){
        // mark as reported; need to report BOTH
        if (!state._flaggedFiles) state._flaggedFiles = new Set();
        state._flaggedFiles.add(item.name);
        if (state._flaggedFiles.has('photo.jpg.exe') && state._flaggedFiles.has('free_vpn_installer.msi')){
          solveTask('files');
          render();
        } else {
          toast('Qismən düzgün', 'Yaxşı! "photo.jpg.exe" şübhəlidir. Digər şübhəli faylı da bildirin.', 'warn', 4000);
        }
      } else if (item.name==='free_vpn_installer.msi'){
        if (!state._flaggedFiles) state._flaggedFiles = new Set();
        state._flaggedFiles.add(item.name);
        if (state._flaggedFiles.has('photo.jpg.exe') && state._flaggedFiles.has('free_vpn_installer.msi')){
          solveTask('files');
          render();
        } else {
          toast('Qismən düzgün', 'Yaxşı! "free_vpn_installer.msi" şübhəlidir. Digər şübhəli faylı da bildirin.', 'warn', 4000);
        }
      } else {
        registerWrong('files');
      }
    } else {
      registerWrong('files','Bu fayl şübhəli deyil.');
    }
  }

  document.getElementById('feBack').addEventListener('click', () => {
    if (currentPath.length>0){ currentPath.pop(); selectedFiles.clear(); render(); }
  });
  document.getElementById('feUp').addEventListener('click', () => {
    if (currentPath.length>0){ currentPath.pop(); selectedFiles.clear(); render(); }
  });
  document.getElementById('feRefresh').addEventListener('click', () => { selectedFiles.clear(); render(); });
  document.getElementById('feNewFolder').addEventListener('click', () => {
    if (currentPath.length===0){ toast('Xəta','"This PC" daxilində qovluq yaratmaq olmaz. Bir diskə keçin.','warn',3000); return; }
    const name = prompt('Yeni qovluğun adı:');
    if (!name) return;
    const folder = getFolderByPath(currentPath);
    if (!folder || folder.children[name]){ toast('Xəta','Bu adda element artıq mövcuddur.','error',3000); return; }
    folder.children[name] = { name, type:'folder', path:[...currentPath,name], children:{} };
    render();
  });
  document.getElementById('feNewFile').addEventListener('click', () => {
    if (currentPath.length===0){ toast('Xəta','"This PC" daxilində fayl yaratmaq olmaz. Bir qovluğa keçin.','warn',3000); return; }
    const name = prompt('Yeni faylın adı (məs. qeyd.txt):','yeni_qeyd.txt');
    if (!name) return;
    const folder = getFolderByPath(currentPath);
    if (!folder || folder.children[name]){ toast('Xəta','Bu adda element artıq mövcuddur.','error',3000); return; }
    const ext = (name.split('.').pop()||'').toLowerCase();
    folder.children[name] = { name, type:'file', ext:ext||'txt', size:'0 KB', modified:'17.11.2026', content:'' };
    render();
    toast('Fayl yaradıldı', '"'+name+'" yaradıldı.','success',2500,true);
  });
  document.getElementById('feShowExt').addEventListener('click', () => { showExtensions = !showExtensions; render(); toast('Görünüş', showExtensions?'Fayl uzantıları göstərilir':'Fayl uzantıları gizlədilib','info',2000,true); });

  // prevent default right-click on empty
  fileList.addEventListener('contextmenu', e => {
    if (e.target.closest('.fe-row')) return;
    e.preventDefault();
    showContextMenu(e.clientX, e.clientY, [

  });

};

/* ============ CALENDAR ============ */
function toggleCalendar(){
  const p = document.getElementById('calendar-panel');
  if (!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  closeAllPanels();
  p.classList.remove('hidden');
  const now = new Date();
  const months = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
  const days = ['B','B.e','Ç','Ç.a','C','C.a','Ş'];
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const startDay = first.getDay();
  const today = now.getDate();
  let grid = days.map(d => '<div class="cal-dow">'+d+'</div>').join('');
  for (let i=0; i<startDay; i++) grid += '<div class="cal-day other"></div>';
  for (let d=1; d<=last.getDate(); d++) grid += '<div class="cal-day'+(d===today?' today':'')+'">'+d+'</div>';
  p.innerHTML = '<div class="cal-time">'+pad2(now.getHours())+':'+pad2(now.getMinutes())+'</div>'+
    '<div class="cal-date">'+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear()+'</div>'+
    '<div class="cal-head"><span>'+months[now.getMonth()]+' '+now.getFullYear()+'</span><span>'+now.getDay()+'</span></div>'+
    '<div class="cal-grid">'+grid+'</div>';
}

function closeAllPanels(){

/* ============ END SCREEN ============ */
function showEndScreen(kind){
  const s = document.getElementById('escape-screen');
  s.classList.remove('hidden');
  s.classList.toggle('timeup', kind==='timeup');
  const solved = SOLVED_COUNT();
  const total = TASK_ORDER.length;
  const acc = state.totalWrong===0 ? 100 : Math.max(0, Math.round(100 - state.totalWrong*8));
  const badges = [];
  if (solved===total) badges.push({ icon:ICONS.trophy, text:'Tam Qələbə' });
  if (state.totalWrong===0) badges.push({ icon:ICONS.shieldOk, text:'Mükəmməl' });
  if (state.hintsUsed && Object.values(state.hintsUsed).every(v=>v===0)) badges.push({ icon:ICONS.eye, text:'İpucusuz' });
  if (state.hintsUsed && Object.values(state.hintsUsed).some(v=>v===0)) badges.push({ icon:ICONS.zap, text:'Sürətli' });
  if (state.infected && !state.threatFiles.every(t=>t.cleaned)) badges.push({ icon:ICONS.alert, text:'Yoluxdurulub' });

  s.innerHTML = '<div class="esc-inner">'+
    '<div class="esc-badge">'+(kind==='timeup'?ICONS.clock:ICONS.shieldOk)+'</div>'+
    '<div class="esc-title">'+(kind==='timeup'?'Vaxt bitdi':'Karantin bitdi')+'</div>'+
    '<div class="esc-sub">'+(kind==='timeup'?'Vaxtınız bitdi, amma yenə də yaxşı cəhd idi. Yenidən cəhd edin.':'Bütün karantin kilidləri açıldı. Siz kiber təhlükəsizlik simulyasiyasını uğurla tamamladınız.')+'</div>'+
    '<div class="esc-stats">'+
      '<div class="esc-stat"><div class="es-val">'+state.score+'</div><div class="es-lbl">Xal</div></div>'+
      '<div class="esc-stat"><div class="es-val">'+solved+'/'+total+'</div><div class="es-lbl">Tapşırıq</div></div>'+
      '<div class="esc-stat"><div class="es-val">'+acc+'%</div><div class="es-lbl">Dəqiqlik</div></div>'+
      '<div class="esc-stat"><div class="es-val">'+state.bestScore+'</div><div class="es-lbl">Rekord</div></div>'+
    '</div>'+
    (badges.length?'<div class="esc-badges-title">Nailiyyətlər</div><div class="esc-badges">'+badges.map(b=>'<div class="esc-badge-pill">'+b.icon+b.text+'</div>').join('')+'</div>':'')+

  '</div>';
  document.getElementById('escRestart').addEventListener('click', () => { clearSave(); location.reload(); });
  document.getElementById('escContinue').addEventListener('click', () => s.classList.add('hidden'));
}

/* ============ BOOT ============ */
function boot(){
  const status = document.getElementById('boot-status');
  const fill = document.getElementById('boot-bar-fill');
  const steps = [
    { txt:'Sistem yoxlanılır...', p:10 },
    { txt:'Təhlükəsizlik modulu yüklənir...', p:30 },
    { txt:'Quarantine Room hazırlanır...', p:55 },
    { txt:'İstifadəçi profili yüklənir...', p:80 },
    { txt:'Hazırdır', p:100 }
  ];
  let i = 0;
  const iv = setInterval(() => {
    if (i>=steps.length){ clearInterval(iv); finishBoot(); return; }
    status.textContent = steps[i].txt;
    fill.style.width = steps[i].p+'%';
    i++;
  }, 400);
}
function finishBoot(){
  const bs = document.getElementById('boot-screen');
  bs.classList.add('fade');
  setTimeout(() => { bs.style.display = 'none'; document.getElementById('desktop').classList.remove('hidden'); }, 700);
}

    }, 4000);
  }

  if (state.escaped || SOLVED_COUNT()>=TASK_ORDER.length){
    // show end screen if was already escaped
    if (state.escaped) setTimeout(()=>showEndScreen('escape'), 1000);
  }

  // Restore timer if running
  if (state.timerStarted && state.timerEnd){
    state.timerRemaining = Math.max(0, state.timerEnd-Date.now());
    if (state.timerRemaining>0){
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(tickTimer, 500);
      updateTimerDisplay();
    } else {
      showEndScreen('timeup');
    }
  }
}

// Escape key to close panels
document.addEventListener('keydown', e => {
  if (e.key==='Escape'){ closeAllPanels(); hideContextMenu(); }
  if (e.key==='F11'){ e.preventDefault(); }
});

init();
})();
</script>
