function updateLockWidget(){
  const scoreEl = document.getElementById('lw-score');
  if (scoreEl) scoreEl.textContent = state.score;
  const bestEl = document.getElementById('lw-best');
  if (bestEl) bestEl.textContent = 'Ən yaxşı: ' + state.bestScore;
  const locksHost = document.getElementById('lw-locks');
  if (!locksHost) return;
  locksHost.innerHTML = '';
  TASK_ORDER.forEach(taskId => {
    const solved = !!state.solved[taskId];
    const lock = el('div', 'lw-lock' + (solved ? ' open' : ''));
    lock.innerHTML = solved ? ICONS.unlock : ICONS.lock;
    lock.title = TASKS[taskId].title + (solved ? ' — açıldı' : '');
    locksHost.appendChild(lock);
  });
  const fill = document.getElementById('lw-progress');
  if (fill) fill.style.width = (SOLVED_COUNT() / TASK_ORDER.length * 100) + '%';
}

/* ============ TASKBAR ============ */
function renderTaskbar(){
  const bar = document.getElementById('taskbar');
  const center = el('div');
  center.id = 'taskbar-center';

  const startBtn = el('button', 'tb-btn');
  startBtn.id = 'start-btn';
  startBtn.title = 'Başlat';
  startBtn.innerHTML = ICON_WIN;
  startBtn.addEventListener('click', e => { e.stopPropagation(); toggleStartMenu(); });
  center.appendChild(startBtn);

  APPS.forEach(app => {
    const btn = el('button', 'tb-btn');
    btn.dataset.app = app.id;
    btn.title = app.name;
    const wrapIcon = el('div', 'tb-app-icon');
    wrapIcon.innerHTML = ICONS[app.icon];
    wrapIcon.style.color = app.color;
    btn.appendChild(wrapIcon);
    btn.addEventListener('click', () => {
      const rec = openWindows.get(app.id);
      if (rec && !rec.minimized) { rec.minimized = true; rec.el.style.display = 'none'; refreshTaskbar(); }
      else openApp(app.id);
    });
    center.appendChild(btn);
  });
  bar.appendChild(center);

  const tray = el('div');
  tray.id = 'system-tray';

  const hintBtn = el('button', 'tray-btn');
  hintBtn.id = 'tray-hint';
  hintBtn.title = 'İpucu';
  hintBtn.innerHTML = ICONS.hint;
  hintBtn.addEventListener('click', e => { e.stopPropagation(); useHint(); });
  tray.appendChild(hintBtn);

  const bellBtn = el('button', 'tray-btn');
  bellBtn.id = 'tray-bell';
  bellBtn.title = 'Bildirişlər';
  bellBtn.innerHTML = ICONS.bell + '<span class="bell-badge hidden" id="bell-badge">0</span>';
  bellBtn.addEventListener('click', e => { e.stopPropagation(); toggleNotifPanel(); });
  tray.appendChild(bellBtn);

  const wifiBtn = el('button', 'tray-btn');
  wifiBtn.id = 'tray-wifi';
  wifiBtn.title = 'Şəbəkə və səs';
  wifiBtn.innerHTML = ICONS.wifi + ICONS.volume;
  wifiBtn.style.gap = '3px';
  wifiBtn.addEventListener('click', e => { e.stopPropagation(); toggleQuickSettings(); });
  tray.appendChild(wifiBtn);

  const timerEl = el('div');
  timerEl.id = 'tray-timer';
  timerEl.className = 'hidden';
  timerEl.title = 'Oyun sayğacı';
  timerEl.innerHTML = ICONS.clock + '<span id="timer-text">' + fmtTime(state.timerDuration) + '</span>';
  tray.appendChild(timerEl);

  const clock = el('div');
  clock.id = 'tray-clock';
  clock.title = 'Tarix və saat';
  clock.addEventListener('click', e => { e.stopPropagation(); toggleCalendarPanel(); });
  tray.appendChild(clock);
  updateClock();
  setInterval(updateClock, 15000);

  bar.appendChild(tray);
}

function updateClock(){
  const c = document.getElementById('tray-clock');
  if (!c) return;
  const d = new Date();
  const time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const date = pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
  c.innerHTML = '<div>' + time + '</div><div class="t2">' + date + '</div>';
}

function renderTaskbarScore(){ updateLockWidget(); }

/* ============ NOTIFICATION PANEL ============ */
function toggleNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if (!panel) return;
  closeOtherPanels('notif');
  const isHidden = panel.classList.contains('hidden');
  if (isHidden) {
    if (!panel.innerHTML.trim()) {
      panel.innerHTML = '<div class="notif-head"><span>Bildirişlər</span><button id="notif-clear">Təmizlə</button></div><div class="notif-list" id="notif-list"></div>';
      panel.querySelector('#notif-clear').addEventListener('click', e => { e.stopPropagation(); notifications.clear(); });
    }
    notifications.render();
    notifications.markAllRead();
    panel.classList.remove('hidden');
    setActiveTray('tray-bell');
  } else {
    panel.classList.add('hidden');
    setActiveTray(null);
  }
}

/* ============ QUICK SETTINGS ============ */
function toggleQuickSettings(){
  let panel = document.getElementById('quick-settings');
  if (panel) { panel.remove(); setActiveTray(null); return; }
  closeOtherPanels('qs');
  panel = el('div');
  panel.id = 'quick-settings';
  panel.innerHTML =
    '<div class="qs-head">Sürətli parametrlər</div>' +
    '<div class="qs-grid">' +
      '<button class="qs-tile ' + (state.settingsToggles.wifi ? 'active' : '') + '" data-qs="wifi">' + ICONS.wifi +
        '<div><div class="qs-name">Wi-Fi</div><div class="qs-status">' + (state.settingsToggles.wifi ? 'CYBERLOCK-SECURE' : 'Bağlı') + '</div></div></button>' +
      '<button class="qs-tile ' + (state.settingsToggles.bluetooth ? 'active' : '') + '" data-qs="bluetooth">' + ICONS.bluetooth +
        '<div><div class="qs-name">Bluetooth</div><div class="qs-status">' + (state.settingsToggles.bluetooth ? 'Aktiv' : 'Bağlı') + '</div></div></button>' +
      '<button class="qs-tile ' + (state.settingsToggles.plane ? 'active' : '') + '" data-qs="plane">' + ICONS.plane +
        '<div><div class="qs-name">Təyyarə</div><div class="qs-status">' + (state.settingsToggles.plane ? 'Aktiv' : 'Bağlı') + '</div></div></button>' +
      '<button class="qs-tile ' + (state.settingsToggles.night ? 'active' : '') + '" data-qs="night">' + ICONS.moon +
        '<div><div class="qs-name">Gecə rejimi</div><div class="qs-status">' + (state.settingsToggles.night ? 'Aktiv' : 'Bağlı') + '</div></div></button>' +
    '</div>' +
    '<div class="qs-slider-row">' + ICONS.volume + '<input type="range" min="0" max="100" value="' + state.volume + '" class="qs-slider" id="qsVol"><span class="qs-slider-val" id="qsVolVal">' + state.volume + '</span></div>' +
    '<div class="qs-slider-row">' + ICONS.sun + '<input type="range" min="0" max="100" value="' + state.brightness + '" class="qs-slider" id="qsBright"><span class="qs-slider-val" id="qsBrightVal">' + state.brightness + '</span></div>';
  document.body.appendChild(panel);

  panel.querySelectorAll('.qs-tile').forEach(tile => {
    tile.addEventListener('click', ev => {
      ev.stopPropagation();
      const key = tile.dataset.qs;
      state.settingsToggles[key] = !state.settingsToggles[key];
      saveState();
      tile.classList.toggle('active', state.settingsToggles[key]);
      const statusEl = tile.querySelector('.qs-status');
      const names = { wifi: { on:'CYBERLOCK-SECURE', off:'Bağlı' }, bluetooth: { on:'Aktiv', off:'Bağlı' }, plane: { on:'Aktiv', off:'Bağlı' }, night: { on:'Aktiv', off:'Bağlı' } };
      statusEl.textContent = state.settingsToggles[key] ? names[key].on : names[key].off;
    });
  });

  const vol = panel.querySelector('#qsVol');
  vol.addEventListener('input', () => { state.volume = Number(vol.value); panel.querySelector('#qsVolVal').textContent = vol.value; saveState(); });
  const bright = panel.querySelector('#qsBright');
  bright.addEventListener('input', () => { state.brightness = Number(bright.value); panel.querySelector('#qsBrightVal').textContent = bright.value; saveState(); });
  setActiveTray('tray-wifi');
}

/* ============ CALENDAR PANEL ============ */
function toggleCalendarPanel(){
  let panel = document.getElementById('calendar-panel');
  if (panel) { panel.remove(); setActiveTray(null); return; }
  closeOtherPanels('cal');
  panel = el('div');
  panel.id = 'calendar-panel';
  const now = new Date();
  const dow = ['B','B.e','Ç','Ç.a','C','C.a','Ş'];
  const months = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const startDay = first.getDay() === 0 ? 6 : first.getDay() - 1;
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  let grid = '';
  dow.forEach(d => { grid += '<div class="cal-dow">' + d + '</div>'; });
  for (let i = 0; i < startDay; i++) grid += '<div class="cal-day other"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === now.getDate();
    grid += '<div class="cal-day' + (isToday ? ' today' : '') + '">' + d + '</div>';
  }
  panel.innerHTML =
    '<div class="cal-time">' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + '</div>' +
    '<div class="cal-date">' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear() + '</div>' +
    '<div class="cal-head"><span>' + months[now.getMonth()] + ' ' + now.getFullYear() + '</span><span>Bugün</span></div>' +
    '<div class="cal-grid">' + grid + '</div>';
  document.body.appendChild(panel);
  setActiveTray('tray-clock');
  const updateTime = () => {
    if (!document.body.contains(panel)) return;
    const n = new Date();
    panel.querySelector('.cal-time').textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
    setTimeout(updateTime, 1000);
  };
  updateTime();
}

function closeOtherPanels(except){
  if (except !== 'notif') { const p = document.getElementById('notif-panel'); if (p) p.classList.add('hidden'); }
  if (except !== 'qs') { const p = document.getElementById('quick-settings'); if (p) p.remove(); }
  if (except !== 'cal') { const p = document.getElementById('calendar-panel'); if (p) p.remove(); }
}
function setActiveTray(id){
  document.querySelectorAll('.tray-btn').forEach(b => b.classList.remove('active'));
  if (id) { const b = document.getElementById(id); if (b) b.classList.add('active'); }
}
document.addEventListener('click', e => {
  const notif = document.getElementById('notif-panel');
  if (notif && !notif.classList.contains('hidden') && !notif.contains(e.target) && !e.target.closest('#tray-bell')) notif.classList.add('hidden');
  const qs = document.getElementById('quick-settings');
  if (qs && !qs.contains(e.target) && !e.target.closest('#tray-wifi')) qs.remove();
  const cal = document.getElementById('calendar-panel');
  if (cal && !cal.contains(e.target) && !e.target.closest('#tray-clock')) cal.remove();
});

/* ============ START MENU ============ */
let startMenuOpen = false;

function toggleStartMenu(){
  const menu = document.getElementById('start-menu');
  startMenuOpen = !startMenuOpen;
  if (startMenuOpen) { renderStartMenu(); menu.classList.remove('hidden'); }
  else menu.classList.add('hidden');
}

function renderStartMenu(query){
  const menu = document.getElementById('start-menu');
  menu.innerHTML = '';
  const search = el('div', 'sm-search');
  search.innerHTML = ICONS.search + '<input type="text" placeholder="Tətbiq axtar..." id="sm-search-input">';
  menu.appendChild(search);
  const input = search.querySelector('#sm-search-input');
  if (query) input.value = query;
  input.addEventListener('input', () => renderStartMenu(input.value));
  setTimeout(() => input.focus(), 30);
  const q = (query || '').trim().toLowerCase();

  function openFirstResult(){
    if (q) {
      const first = APPS.find(a => a.name.toLowerCase().indexOf(q) !== -1);
      if (first) { toggleStartMenu(); openApp(first.id); return; }
    }
    const visibleApps = menu.querySelectorAll('.sm-app');
    if (visibleApps.length > 0) { toggleStartMenu(); }
  }
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; renderStartMenu(); }
    if (e.key === 'Enter') openFirstResult();
  });

  if (q) {
    const results = APPS.filter(a => a.name.toLowerCase().indexOf(q) !== -1);
    menu.appendChild(smLabel('Nəticələr'));
    if (results.length === 0) menu.appendChild(el('div', 'sm-empty', 'Heç bir tətbiq tapılmadı.'));
    else { const grid = el('div', 'sm-grid'); results.forEach(a => grid.appendChild(smAppTile(a))); menu.appendChild(grid); }
  } else {
    menu.appendChild(smLabel('Bütün tətbiqlər'));
    const grid = el('div', 'sm-grid');
    APPS.forEach(a => grid.appendChild(smAppTile(a)));
    menu.appendChild(grid);
    menu.appendChild(smLabel('Tövsiyə olunan'));
    const recHost = el('div', 'sm-recommended');
    if (state.recentApps.length === 0) recHost.appendChild(el('div', 'sm-empty', 'Hələ heç bir tətbiq açılmayıb.'));
    else {
      state.recentApps.forEach(appId => {
        const app = APP_BY_ID[appId];
        if (!app) return;
        const item = el('button', 'sm-rec-item');
        item.innerHTML = '<div class="sm-rec-icon" style="background:' + app.grad + '">' + ICONS[app.icon] + '</div>' +
          '<div><div class="sm-rec-name">' + app.name + '</div><div class="sm-rec-sub">Son açılan</div></div>';
        item.addEventListener('click', () => { toggleStartMenu(); openApp(app.id); });
        recHost.appendChild(item);
      });
    }
    menu.appendChild(recHost);
  }

  const foot = el('div', 'sm-footer');
  foot.innerHTML = '<div class="sm-user"><div class="sm-avatar">AZ</div><span>Tələbə Hesabı</span></div>' +
    '<button class="sm-power" id="sm-power" title="Sistem">' + ICONS.power + '</button>';
  menu.appendChild(foot);
  foot.querySelector('#sm-power').addEventListener('click', e => { e.stopPropagation(); startMenuOpen = false; menu.classList.add('hidden'); showPowerModal(); });
}

function smLabel(text){ return el('div', 'sm-section-label', text); }
function smAppTile(app){
  const tile = el('button', 'sm-app');
  tile.innerHTML = '<div class="tile" style="background:' + app.grad + '">' + ICONS[app.icon] + '</div><div class="label">' + app.name + '</div>';
  tile.addEventListener('click', () => { toggleStartMenu(); openApp(app.id); });
  return tile;
}

document.addEventListener('click', e => {
  if (!startMenuOpen) return;
  const menu = document.getElementById('start-menu');
  if (menu.contains(e.target)) return;
  if (e.target.closest('#start-btn') || e.target.closest('#taskbar')) return;
  startMenuOpen = false;
  menu.classList.add('hidden');
});

/* ============ POWER MODAL ============ */
function showPowerModal(){
  showModal(
    '<div class="modal-head">' +
      '<div class="mh-icon" style="background:var(--danger-light);color:var(--danger)">' + ICONS.power + '</div>' +
      '<div><h3>Sistemdən çıxış</h3><div class="mh-sub">Cari irəliləyiş silinəcək</div></div>' +
    '</div>' +
    '<div class="modal-body">' +
      '<p style="font-size:13px;line-height:1.7;color:#3b3b3b;margin-bottom:14px">Yenidən başlatmaq bütün irəliləyişi, xalı və tapşırıq nəticələrini siləcək.</p>' +
      '<div class="cert-row"><span class="ck">Cari xal</span><span class="cv">' + state.score + '</span></div>' +
      '<div class="cert-row"><span class="ck">Ən yaxşı</span><span class="cv">' + state.bestScore + '</span></div>' +
      '<div class="cert-row"><span class="ck">Həll edilmiş</span><span class="cv">' + SOLVED_COUNT() + ' / ' + TASK_ORDER.length + '</span></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<div class="modal-score">Davam etmək istəyirsiniz?</div>' +
      '<div style="display:flex;gap:10px">' +
        '<button class="m-btn ghost" id="powerCancel">Ləğv et</button>' +
        '<button class="m-btn danger" id="powerRestart">Yenidən başlat</button>' +
      '</div>' +
    '</div>',
    { dismissable: true }
  );
  document.getElementById('powerCancel').addEventListener('click', closeModal);
  document.getElementById('powerRestart').addEventListener('click', () => {
    closeModal();
    clearSave();
    try { localStorage.removeItem(N_KEY); } catch(e){}
    setTimeout(() => location.reload(), 150);
  });
}

/* ============ END SCREEN ============ */
function showEndScreen(kind){
  if (state.escaped) return;
  state.escaped = true;
  stopTimer(); saveState();
  const screen = document.getElementById('escape-screen');
  screen.classList.remove('hidden');
  screen.classList.toggle('timeup', kind === 'timeup');
  screen.innerHTML = '';
  const solvedCount = SOLVED_COUNT();
  const totalTasks = TASK_ORDER.length;
  const hintsTotal = TASK_ORDER.reduce((s, id) => s + (state.hintsUsed[id] || 0), 0);
  const elapsed = state.timerDuration - state.timerRemaining;
  const timeStr = fmtTime(elapsed);
  const badges = [];
  if (solvedCount === totalTasks) {
    const allFirstTry = TASK_ORDER.every(id => state.firstTry[id] !== false && state.solved[id]);
    if (allFirstTry) badges.push({ icon: ICONS.zap, text: 'İlk cəhddə' });
    if (hintsTotal === 0) badges.push({ icon: ICONS.hint, text: 'İpucusuz' });
    if (elapsed <= 5 * 60 * 1000) badges.push({ icon: ICONS.trophy, text: 'Sürətli' });
    if ((state.totalWrong || 0) === 0) badges.push({ icon: ICONS.shieldOk, text: 'Qüsursuz' });
  }
  if (state.bestScore > 0 && state.score >= state.bestScore) badges.push({ icon: ICONS.trophy, text: 'Yeni rekord' });
  const title = kind === 'timeup' ? 'Vaxt bitdi!' : (solvedCount === totalTasks ? 'Quarantin açıldı!' : 'Oyun bitdi');
  const subtitle = kind === 'timeup' ? 'Vaxt bitdi. Yenidən cəhd edin — hər səhv öyrədir.' :
    (solvedCount === totalTasks ? 'Bütün 5 tapşırığı uğurla həll etdiniz. Quarantin otağı açıldı.' : 'Bütün tapşırıqları həll etməmiş bitirdiniz.');
  const badgeIcon = kind === 'timeup' ? ICONS.clock : ICONS.shieldOk;
  screen.innerHTML =
    '<div class="esc-inner">' +
      '<div class="esc-badge">' + badgeIcon + '</div>' +
      '<div class="esc-title">' + title + '</div>' +
      '<div class="esc-sub">' + subtitle + '</div>' +
      '<div class="esc-stats">' +
        '<div class="esc-stat"><div class="es-val">' + state.score + '</div><div class="es-lbl">Xal</div></div>' +
        '<div class="esc-stat"><div class="es-val">' + solvedCount + '/' + totalTasks + '</div><div class="es-lbl">Həll</div></div>' +
        '<div class="esc-stat"><div class="es-val">' + timeStr + '</div><div class="es-lbl">Vaxt</div></div>' +
        '<div class="esc-stat"><div class="es-val">' + state.bestScore + '</div><div class="es-lbl">Rekord</div></div>' +
      '</div>' +
      (badges.length ? '<div class="esc-badges-title">Nailiyyətlər</div><div class="esc-badges">' + badges.map(b => '<div class="esc-badge-pill">' + b.icon + '<span>' + b.text + '</span></div>').join('') + '</div>' : '') +
      '<button class="esc-btn" id="escRestart">Yenidən başla</button>' +
      '<button class="esc-btn ghost" id="escReview" style="margin-top:10px">Nəticələrə bax</button>' +
      '<div class="esc-note">Siz artıq real həyatda bu tələləri tanımağı bacarırsınız. Şübhəli linklərə klikləməzdən əvvəl həmişə iki dəfə düşünün.</div>' +
    '</div>';
  document.getElementById('escRestart').addEventListener('click', () => { clearSave(); try { localStorage.removeItem(N_KEY); } catch(e){} location.reload(); });
  document.getElementById('escReview').addEventListener('click', () => { screen.classList.add('hidden'); if (SOLVED_COUNT() < TASK_ORDER.length) showModeModal(); });
}

/* ============ MODE MODAL ============ */
function showModeModal(){
  showModal(
    '<div class="modal-head"><div class="mh-icon">' + ICONS.zap + '</div><div><h3>Oyun rejimini seçin</h3><div class="mh-sub">Sayğac ilk tətbiq açılanda başlayır</div></div></div>' +
    '<div class="modal-body"><div class="mode-options">' +
      '<button class="mode-card" data-mode="normal"><div class="mc-icon">' + ICONS.shieldOk + '</div><div class="mc-name">Normal</div><div class="mc-desc">10 dəqiqə — rahat temp</div></button>' +
      '<button class="mode-card" data-mode="speedrun"><div class="mc-icon">' + ICONS.zap + '</div><div class="mc-name">Speedrun</div><div class="mc-desc">4 dəqiqə — sürətli</div></button>' +
    '</div></div>',
    { dismissable: false }
  );
  document.querySelectorAll('.mode-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      state.mode = mode;
      state.timerDuration = mode === 'speedrun' ? SPEEDRUN_DURATION : DEFAULT_DURATION;
      state.timerRemaining = state.timerDuration;
      state.timerEnd = null; state.timerStarted = false;
      closeModal(); updateTimerDisplay(); saveState();
      toast('Oyun rejimi', (mode === 'speedrun' ? 'Speedrun' : 'Normal') + ' — ' + (mode === 'speedrun' ? '4' : '10') + ' dəqiqə. Uğurlar!', 'info', 4000, true);
    });
  });
}

/* ============ BOOT ============ */
const BOOT_STEPS = ['Yaddaş yoxlanılır...','Təhlükəsizlik modulu yüklənir...','Quarantin otağı hazırlanır...','5 tapşırıq aşkarlandı...','Sistem hazırdır.'];
function runBoot(){
  const bar = document.getElementById('boot-bar-fill');
  const status = document.getElementById('boot-status');
  let i = 0;
  const timer = setInterval(() => {
    if (i < BOOT_STEPS.length) {
      status.textContent = BOOT_STEPS[i];
      bar.style.width = Math.round((i + 1) / BOOT_STEPS.length * 100) + '%';
      i++;
    } else {
      clearInterval(timer);
      setTimeout(() => {
        document.getElementById('boot-screen').classList.add('fade');
        document.getElementById('desktop').classList.remove('hidden');
        setTimeout(() => document.getElementById('boot-screen').remove(), 750);
        afterBoot();
      }, 350);
    }
  }, 480);
}

function afterBoot(){
  renderDesktopIcons();
  renderLockWidget();
  renderTaskbar();
  updateHintButton();
  notifications.init();
  notifications.render();
  notifications.updateBadge();

  events.on('task:solved', d => {
    const task = TASKS[d.taskId];
    const extras = [];
    if (d.within30s) extras.push('sürət bonusu');
    if (d.streakBonus) extras.push('streak ×1.2');
    toast('Tapşırıq həll olundu', task.title + ' — +' + d.points + ' bal' + (extras.length ? ' (' + extras.join(', ') + ')' : ''), 'success', 5000);
  });
  events.on('task:wrong', d => {
    const task = TASKS[d.taskId];
    toast('Səhv cavab', task.title + (d.penalty > 0 ? ' — −' + d.penalty + ' bal' : ' — cəzasız (ilk 2 səhv)'), 'error', 5000);
  });

  const restored = loadState();
  if (restored && state.escaped) { showEndScreen(state.timerRemaining <= 0 ? 'timeup' : 'escape'); return; }
  if (restored && state.timerStarted && state.timerEnd) {
    const remaining = state.timerEnd - Date.now();
    if (remaining <= 0) { state.timerRemaining = 0; showEndScreen('timeup'); return; }
    state.timerRemaining = remaining;
    updateTimerDisplay();
  } else if (restored && Object.keys(state.solved).length > 0) {
    state.timerStarted = false;
    showModeModal();
  } else {
    showModeModal();
  }
}

window.addEventListener('load', runBoot);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    hideContextMenu();
    const notif = document.getElementById('notif-panel'); if (notif) notif.classList.add('hidden');
    const qs = document.getElementById('quick-settings'); if (qs) qs.remove();
    const cal = document.getElementById('calendar-panel'); if (cal) cal.remove();
    if (startMenuOpen) { startMenuOpen = false; document.getElementById('start-menu').classList.add('hidden'); }
    const modal = document.getElementById('modal-backdrop');
    if (modal && !modal.classList.contains('hidden')) closeModal();
  }
});

})();
